<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="build" content="2026-08-02g">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Job Log">
<meta name="mobile-web-app-capable" content="yes">
<title>TN Info Tech — Job Log</title>
<style>
:root{
  --ink:#15171b;
  --ink-2:#3d434d;
  --ink-3:#6b7280;
  --line:#e3e5e9;
  --line-2:#eef0f3;
  --paper:#ffffff;
  --bg:#f5f6f8;
  --rail:#15171b;
  --rail-2:#1d2027;
  --accent:#e8590c;
  --accent-soft:#fdf1e9;
  --good:#137a4f;
  --radius:8px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.45;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.rail{
  width:236px;flex:0 0 236px;background:var(--rail);color:#a8afba;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;color:#fff;font-size:14px;letter-spacing:.14em;font-weight:700}
.brand small{display:block;color:#727a86;font-size:11px;letter-spacing:.1em;margin-top:5px;text-transform:uppercase}
.nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border-radius:6px;color:#a8afba;font-size:14px;font-weight:500;
  transition:background .12s,color .12s;
}
.nav button:hover{background:rgba(255,255,255,.05);color:#e6e9ee}
.nav button.on{background:var(--rail-2);color:#fff}
.nav button.on .dot{background:var(--accent)}
.dot{width:5px;height:5px;border-radius:50%;background:#3b414c;flex:0 0 5px}
.rail-foot{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.07);font-size:12px;color:#6a7280}
.who{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.who .av{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.who span{color:#c3c9d2;font-size:13px}
.syncdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#4b525c;margin-right:6px;vertical-align:middle}
.syncdot.live{background:#22c55e}
.syncdot.err{background:#ef4444}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{
  background:var(--paper);border-bottom:1px solid var(--line);
  padding:18px 28px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;
}
.top h1{font-size:20px;letter-spacing:-.02em;font-weight:650}
.top p{color:var(--ink-3);font-size:13px;margin-top:3px}
.wrap{padding:24px 28px 60px;max-width:1180px;width:100%}

/* ---------- bits ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:6px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  transition:border-color .12s,background .12s;
}
.btn:hover{border-color:#c9cdd4;background:#fbfbfc}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000;border-color:#000}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.accent:hover{background:#d24f07;border-color:#d24f07}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-3)}
.btn.ghost:hover{background:#eceef1;color:var(--ink)}
.btn[disabled]{opacity:.5;pointer-events:none}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius)}
.panel-h{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-h h2{font-size:14px;font-weight:650;letter-spacing:.01em}
.panel-b{padding:18px}

label.f{display:block;font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.02em;margin-bottom:6px}
.inp{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;
  transition:border-color .12s,box-shadow .12s;font-size:14.5px;
}
.inp:focus{outline:none;border-color:var(--ink-2);box-shadow:0 0 0 3px rgba(21,23,27,.07)}
textarea.inp{resize:vertical;min-height:92px;line-height:1.5}
.hint{font-size:12px;color:var(--ink-3);margin-top:6px}

/* segmented control */
.seg{display:inline-flex;background:#eef0f3;border-radius:7px;padding:3px;gap:3px}
.seg button{padding:6px 13px;border-radius:5px;font-size:13px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.timerow{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.timerow .tf{flex:0 0 auto}
.timerow .tf .inp{width:150px}
.nowbtn{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.05em;margin-left:6px}
.nowbtn:hover{text-decoration:underline}
.calc{
  flex:1;min-width:190px;border:1px dashed var(--line);border-radius:7px;padding:9px 13px;background:#fbfbfc;
}
.calc b{font-size:19px;font-weight:680;letter-spacing:-.02em}
.calc span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.calc.live{border-style:solid;border-color:#f0c3a1;background:var(--accent-soft)}
.calc.live b{color:#9a3a05}
.times{font-size:12px;color:var(--ink-3);font-weight:600}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--accent-soft);border-color:#f0c3a1;color:#9a3a05}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}

/* billing status pills */
.pill{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid;white-space:nowrap;
}
.pill.unbilled{background:#fff;border-color:#d9dde3;color:#6b7280}
.pill.partial {background:#fff7ed;border-color:#f0c3a1;color:#9a3a05}
.pill.billed  {background:#ecfdf3;border-color:#a7e0c0;color:#137a4f}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}

/* inline billing dropdown */
.billsel{
  appearance:none;-webkit-appearance:none;
  padding:5px 24px 5px 10px;border-radius:999px;border:1px solid;
  font-size:11.5px;font-weight:700;letter-spacing:.03em;cursor:pointer;
  background-repeat:no-repeat;background-position:right 8px center;background-size:8px;
}
.billsel:focus{outline:none;box-shadow:0 0 0 3px rgba(21,23,27,.08)}
.billsel.unbilled{background-color:#fff;border-color:#d9dde3;color:#4b5563;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%236b7280' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>")}
.billsel.partial{background-color:#fff7ed;border-color:#f0c3a1;color:#9a3a05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%239a3a05' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>")}
.billsel.billed{background-color:#ecfdf3;border-color:#a7e0c0;color:#137a4f;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23137a4f' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>")}
@media(max-width:860px){ .billsel{font-size:13px;padding:8px 26px 8px 12px} }
.stat.warn .v{color:var(--accent)}
.stat{background:var(--paper);padding:15px 18px}
.stat .k{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.stat .v{font-size:26px;font-weight:660;letter-spacing:-.03em;margin-top:5px}
.stat .v small{font-size:14px;font-weight:600;color:var(--ink-3);letter-spacing:0}

.weekbar{display:flex;align-items:center;gap:8px}
.weekbar .rng{font-size:14px;font-weight:650;min-width:172px;text-align:center}

/* client group */
.grp{border-bottom:1px solid var(--line-2)}
.grp:last-child{border-bottom:none}
.grp-h{display:flex;align-items:center;gap:14px;padding:13px 18px;width:100%;text-align:left;transition:background .1s}
.grp-h:hover{background:#fafbfc}
.grp-h .car{color:var(--ink-3);font-size:10px;transition:transform .15s;flex:0 0 10px}
.grp.open .grp-h .car{transform:rotate(90deg)}
.grp-h .nm{font-weight:640;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp-h .ct{font-size:12px;color:var(--ink-3);flex:0 0 auto}
.grp-h .hr{font-weight:680;font-size:15px;flex:0 0 auto;min-width:62px;text-align:right}
.bar{height:4px;background:var(--line-2);border-radius:2px;flex:0 0 110px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.grp-b{display:none;padding:2px 18px 16px 42px}
.grp.open .grp-b{display:block}
.ent{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line-2)}
.ent .d{flex:0 0 92px;font-size:12.5px;color:var(--ink-3);font-weight:600;padding-top:1px}
.ent .n{flex:1;font-size:14px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.ent .h{flex:0 0 auto;font-size:13px;font-weight:660}
.ent .x{flex:0 0 auto;opacity:.35;color:var(--ink-3);font-size:12px;font-weight:650;padding:0 4px}
.ent:hover .x{opacity:1}
.ent .x:hover{color:var(--accent);text-decoration:underline}
@media(hover:none){.ent .x{opacity:1;color:var(--accent)}}

.empty{padding:44px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px;font-weight:640}

.row{display:flex;gap:14px;flex-wrap:wrap}
.col{flex:1;min-width:180px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mt{margin-top:16px}
.mb{margin-bottom:16px}

.res{display:flex;gap:16px;padding:14px 18px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.res:last-child{border-bottom:none}
.res:hover{background:#fafbfc}
.res .meta{flex:0 0 150px}
.res .meta b{display:block;font-size:14px;font-weight:650}
.res .meta span{font-size:12.5px;color:var(--ink-3)}
.res .txt{flex:1;font-size:14px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word}
.res .hh{flex:0 0 auto;font-weight:660;font-size:14px}
mark{background:#fff2b8;color:inherit;padding:0 1px;border-radius:2px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);opacity:0;pointer-events:none;
  background:var(--ink);color:#fff;padding:10px 16px;border-radius:7px;font-size:13.5px;font-weight:550;
  transition:opacity .18s,transform .18s;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.22);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.mask{position:fixed;inset:0;background:rgba(15,17,20,.45);display:none;z-index:90;padding:24px;overflow:auto}
.mask.show{display:block}
.modal{background:var(--paper);max-width:560px;margin:40px auto;border-radius:10px;overflow:hidden}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:15px;font-weight:650}
.modal-b{padding:20px;max-height:64vh;overflow:auto}
.modal-f{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:8px;background:#fafbfc}
pre.sql{background:#15171b;color:#d6dae0;padding:14px;border-radius:7px;font-family:var(--mono);font-size:11.5px;line-height:1.55;overflow:auto;white-space:pre}
ol.steps{margin:0 0 4px 18px;font-size:13.5px;color:var(--ink-2)}
ol.steps li{margin-bottom:9px}

/* client cards + picker */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.ccard{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;transition:border-color .12s,box-shadow .12s;width:100%}
.ccard:hover{border-color:var(--ink-2);box-shadow:0 3px 10px rgba(0,0,0,.06)}
.ccard h3{font-size:15.5px;font-weight:660;letter-spacing:-.01em}
.ccard .ad{font-size:12.5px;color:var(--ink-3);margin-top:3px;min-height:17px}
.ccard .nums{display:flex;gap:16px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line-2)}
.ccard .nums div{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:650}
.ccard .nums b{display:block;font-size:17px;letter-spacing:-.02em;color:var(--ink);margin-top:2px;font-weight:660}
.kv{display:grid;grid-template-columns:112px 1fr;gap:9px 14px;font-size:14px}
.kv dt{color:var(--ink-3);font-weight:600;font-size:12.5px;padding-top:1px}
.kv dd{color:var(--ink)}
.pick{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:7px;margin-top:10px}
.pick button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.pick button:last-child{border-bottom:none}
.pick button:hover{background:#f5f6f8}
.pick b{font-size:14px;font-weight:640;display:block}
.pick span{font-size:12px;color:var(--ink-3)}

.rep{font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:#fafbfc;border:1px solid var(--line);border-radius:7px;padding:16px;max-height:420px;overflow:auto}

.mobtop{display:none}

@media(max-width:860px){
  .rail{display:none}

  /* ---- bottom tab bar, thumb height ---- */
  .mobtop{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--rail);color:#fff;align-items:stretch;justify-content:space-around;
    padding:0 4px calc(env(safe-area-inset-bottom, 0px));
    box-shadow:0 -1px 0 rgba(255,255,255,.08), 0 -8px 24px rgba(0,0,0,.18);
  }
  .mobtop b{display:none}
  .mobtop button{
    flex:1;color:#8b929d;font-size:11px;font-weight:650;letter-spacing:.01em;
    padding:11px 2px 9px;border-radius:0;display:flex;flex-direction:column;
    align-items:center;gap:5px;white-space:nowrap;position:relative;
  }
  .mobtop button::before{
    content:"";width:19px;height:19px;border-radius:5px;
    border:2px solid currentColor;opacity:.85;
  }
  .mobtop button[data-v="log"]::before{border-radius:50%}
  .mobtop button[data-v="week"]::before{border-radius:3px;border-width:2px 2px 6px 2px}
  .mobtop button[data-v="clients"]::before{border-radius:50% 50% 6px 6px}
  .mobtop button[data-v="find"]::before{border-radius:50%;border-width:3px}
  .mobtop button[data-v="set"]::before{border-radius:4px;border-style:dashed}
  .mobtop button.on{color:#fff}
  .mobtop button.on::after{
    content:"";position:absolute;top:0;left:22%;right:22%;height:2.5px;
    background:var(--accent);border-radius:0 0 3px 3px;
  }

  /* header + page */
  .top{padding:14px 16px 12px;position:sticky;top:0;z-index:40}
  .top h1{font-size:19px}
  .top > div:last-child{width:100%}
  .wrap{padding:14px 14px calc(96px + env(safe-area-inset-bottom, 0px))}

  /* forms: 16px stops iOS from zooming on focus */
  .inp{font-size:16px;padding:12px 13px}
  textarea.inp{min-height:120px}
  label.f{font-size:12.5px}
  .btn{padding:11px 15px;font-size:14.5px}
  .btn.sm{padding:9px 12px;font-size:13px}
  .chip{padding:9px 14px;font-size:14px}
  .seg button{padding:9px 14px;font-size:13.5px}

  /* big, full-width, at the end of the form where it belongs */
  .btn.accent[type="submit"]{ padding:15px;font-size:16px;margin-top:4px }

  .panel{border-radius:10px}
  .panel-b{padding:16px}
  .panel-h{padding:13px 16px}

  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:13px 15px}
  .stat .v{font-size:23px}
  .grid2{grid-template-columns:1fr}

  /* time + odometer rows stack cleanly */
  .timerow{gap:12px}
  .timerow .tf{flex:1 1 calc(50% - 6px)}
  .timerow .tf .inp{width:100%}
  .calc{flex:1 1 100%;min-width:0}

  /* week report rows */
  .grp-h{padding:14px 16px;gap:10px}
  .grp-h .ct,.bar{display:none}
  .grp-h .nm{font-size:15px}
  .grp-b{padding:2px 16px 14px 16px}
  .ent{flex-wrap:wrap;gap:8px}
  .ent .d{flex:0 0 auto;font-size:12px}
  .ent .n{flex:1 1 100%;order:3}
  .ent .h{margin-left:auto}
  .ent .x{opacity:1;order:4;margin-left:auto}

  .res{flex-wrap:wrap;gap:8px;padding:14px 16px}
  .res .meta{flex:1 1 auto}
  .res .txt{flex:1 1 100%;order:3}
  .res .hh{margin-left:auto}

  .cgrid{grid-template-columns:1fr}
  .kv{grid-template-columns:96px 1fr}

  .modal{margin:0;border-radius:14px 14px 0 0;position:fixed;left:0;right:0;bottom:0;max-width:none}
  .modal-b{max-height:58vh;padding:18px 16px}
  .modal-f{padding:14px 16px calc(16px + env(safe-area-inset-bottom, 0px));gap:10px}
  .modal-f .btn{flex:1;justify-content:center}
  .mask{padding:0}
  .toast{bottom:calc(86px + env(safe-area-inset-bottom, 0px));width:auto;max-width:88%;text-align:center}
}
@media print{
  .rail,.mobtop,.top,.noprint{display:none!important}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .panel{border:none}
  .grp-b{display:block!important}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <div class="brand">
      <b>TN INFO TECH</b>
      <small>Job Log</small>
    </div>
    <nav class="nav" id="nav">
      <button data-v="log" class="on"><i class="dot"></i>New Entry</button>
      <button data-v="week"><i class="dot"></i>Week Report</button>
      <button data-v="clients"><i class="dot"></i>Clients</button>
      <button data-v="subs"><i class="dot"></i>Recurring</button>
      <button data-v="find"><i class="dot"></i>History</button>
      <button data-v="set"><i class="dot"></i>Settings</button>
    </nav>
    <div class="rail-foot">
      <div class="who"><div class="av" id="avatar">?</div><span id="whoName">Set your name</span></div>
      <div><span class="syncdot" id="syncDot"></span><span id="syncTxt">Local only</span></div>
    </div>
  </aside>

  <div class="mobtop" id="mobnav">
    <b>TN INFO TECH</b>
    <button data-v="log" class="on">Log</button>
    <button data-v="week">Week</button>
    <button data-v="clients">Clients</button>
    <button data-v="subs">Recurring</button>
    <button data-v="find">Search</button>
    <button data-v="set">Settings</button>
  </div>

  <main class="main">
    <header class="top">
      <div>
        <h1 id="ttl">New Entry</h1>
        <p id="sub">Log where you were and what you did.</p>
      </div>
      <div id="topAct"></div>
    </header>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* =========================================================
   STORE  — offline-first, optional shared cloud table
   ========================================================= */
const KEY  = "tnit.joblog.v1";
const AUTH = "tnit.session";

/* Public project config. The anon key grants nothing on its own —
   every table requires a signed-in session (see RLS policies). */
const SUPA_URL = "https://nhduyhaopyctmubzckpt.supabase.co";
const SUPA_KEY = window.TNIT_KEY || "";

/* =========================================================
   AUTH — email + password against Supabase GoTrue
   ========================================================= */
const Auth = {
  session: null,

  load(){
    try{ this.session = JSON.parse(localStorage.getItem(AUTH) || "null"); }catch(e){ this.session = null; }
    return this.session;
  },
  store(s){
    this.session = s;
    if(s) localStorage.setItem(AUTH, JSON.stringify(s));
    else  localStorage.removeItem(AUTH);
  },
  get token(){ return this.session ? this.session.access_token : null; },
  get email(){ return this.session && this.session.user ? this.session.user.email : ""; },
  signedIn(){ return !!this.token; },

  async post(path, body, extraHeaders){
    const r = await fetch(SUPA_URL + "/auth/v1/" + path, {
      method:"POST",
      headers: Object.assign({ "apikey":SUPA_KEY, "Content-Type":"application/json" }, extraHeaders||{}),
      body: JSON.stringify(body)
    });
    const data = await r.json().catch(()=> ({}));
    if(!r.ok) throw new Error(data.error_description || data.msg || data.message || ("HTTP " + r.status));
    return data;
  },

  async signIn(email, password){
    const s = await this.post("token?grant_type=password", { email:email.trim(), password });
    s.expires_at = Date.now() + (s.expires_in || 3600) * 1000;
    this.store(s);
    return s;
  },

  async refresh(){
    if(!this.session || !this.session.refresh_token) return false;
    try{
      const s = await this.post("token?grant_type=refresh_token", { refresh_token:this.session.refresh_token });
      s.expires_at = Date.now() + (s.expires_in || 3600) * 1000;
      this.store(s);
      return true;
    }catch(e){ this.store(null); return false; }
  },

  /* keep the token fresh; called before anything touches the database */
  async ready(){
    if(!this.session) return false;
    if(this.session.expires_at && Date.now() > this.session.expires_at - 60000) return this.refresh();
    return true;
  },

  async sendReset(email){
    return this.post("recover", { email:email.trim() });
  },

  async setPassword(newPass){
    const r = await fetch(SUPA_URL + "/auth/v1/user", {
      method:"PUT",
      headers:{ "apikey":SUPA_KEY, "Content-Type":"application/json", "Authorization":"Bearer " + this.token },
      body: JSON.stringify({ password:newPass })
    });
    const d = await r.json().catch(()=> ({}));
    if(!r.ok) throw new Error(d.msg || d.message || "Couldn't change the password");
    return d;
  },

  async signOut(){
    try{
      await fetch(SUPA_URL + "/auth/v1/logout", {
        method:"POST",
        headers:{ "apikey":SUPA_KEY, "Authorization":"Bearer " + this.token }
      });
    }catch(e){}
    this.store(null);
  }
};

const DB = {
  s: { entries: [], clients: {}, subs: [], person: "", url: "", key: "", weekStart: 1, round: 0, mode: "clock", lock: null },

  load(){
    try{ const r = localStorage.getItem(KEY); if(r) Object.assign(this.s, JSON.parse(r)); }catch(e){}
    if(!Array.isArray(this.s.entries)) this.s.entries = [];
    if(!Array.isArray(this.s.subs)) this.s.subs = [];
    if(!this.s.clients || typeof this.s.clients !== "object") this.s.clients = {};
    this.backfillClients();
  },

  /* any client that only exists inside old entries gets a real record */
  backfillClients(){
    let made = false;
    this.live().forEach(e => {
      const k = e.client.trim().toLowerCase();
      if(!k) return;
      if(!this.s.clients[k]){
        this.s.clients[k] = { id:k, name:e.client.trim(), address:e.address||"",
                              phone:"", contact:"", note:"",
                              updated_at:new Date(0).toISOString(), deleted:false };
        made = true;
      } else if(!this.s.clients[k].address && e.address){
        this.s.clients[k].address = e.address; made = true;
      }
    });
    if(made) this.save();
  },
  save(){ localStorage.setItem(KEY, JSON.stringify(this.s)); },

  linked(){ return Auth.signedIn(); },

  live(){ return this.s.entries.filter(e => !e.deleted); },

  add(e){
    const row = {
      id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)),
      work_date: e.date, client: e.client.trim(), hours: Number(e.hours),
      start_time: e.start || "", end_time: e.end || "",
      address: (e.address||"").trim(),
      miles_start: e.milesStart === "" || e.milesStart == null ? null : Number(e.milesStart),
      miles_end:   e.milesEnd   === "" || e.milesEnd   == null ? null : Number(e.milesEnd),
      notes: e.notes.trim(), person: this.s.person || "",
      billed: e.billed || "unbilled",
      updated_at: new Date().toISOString(), deleted: false
    };
    this.s.entries.push(row); this.save(); Cloud.push([row]);
    this.saveClient({ name: row.client, address: row.address || undefined });  // keep the client record current
    return row;
  },
  update(id, patch){
    const r = this.s.entries.find(x => x.id === id);
    if(!r) return null;
    Object.assign(r, patch, { updated_at: new Date().toISOString() });
    this.save(); Cloud.push([r]);
    if(r.address) this.saveClient({ name:r.client, address:r.address });
    return r;
  },
  remove(id){
    const r = this.s.entries.find(x => x.id === id);
    if(!r) return;
    r.deleted = true; r.updated_at = new Date().toISOString();
    this.save(); Cloud.push([r]);
  },
  clients(){
    const seen = new Map();
    this.live().forEach(e => seen.set(e.client.toLowerCase(), e.client));
    return [...seen.values()].sort((a,b)=>a.localeCompare(b));
  },
  /* ---- recurring subscriptions ---- */
  liveSubs(){ return this.s.subs.filter(s => !s.deleted); },
  subsFor(client){
    const k = (client||"").trim().toLowerCase();
    return this.liveSubs().filter(s => s.client.trim().toLowerCase() === k);
  },
  saveSub(sub){
    const isNew = !sub.id;
    const row = Object.assign({
      id: isNew ? (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random().toString(16).slice(2)) : sub.id,
      deleted: false
    }, sub, { updated_at: new Date().toISOString() });
    if(isNew) this.s.subs.push(row);
    else {
      const i = this.s.subs.findIndex(x => x.id === row.id);
      if(i >= 0) this.s.subs[i] = Object.assign(this.s.subs[i], row); else this.s.subs.push(row);
    }
    this.save(); Cloud.push([row], "subs");
    if(row.client) this.saveClient({ name: row.client });
    return row;
  },
  removeSub(id){
    const r = this.s.subs.find(x => x.id === id);
    if(!r) return;
    r.deleted = true; r.updated_at = new Date().toISOString();
    this.save(); Cloud.push([r], "subs");
  },
  mergeSubs(rows){
    let n = 0;
    const byId = new Map(this.s.subs.map(s => [s.id, s]));
    rows.forEach(r => {
      const cur = byId.get(r.id);
      if(!cur){ this.s.subs.push(r); byId.set(r.id, r); n++; }
      else if((r.updated_at||"") > (cur.updated_at||"")){ Object.assign(cur, r); n++; }
    });
    if(n) this.save();
    return n;
  },

  /* everyone who has ever logged a job */
  people(){
    const set = new Map();
    this.live().forEach(e => { const p=(e.person||"").trim(); if(p) set.set(p.toLowerCase(), p); });
    if(this.s.person) set.set(this.s.person.toLowerCase(), this.s.person);
    return [...set.values()].sort((a,b)=>a.localeCompare(b));
  },

  /* ---- client records ---- */
  clientList(){
    return Object.values(this.s.clients)
      .filter(c => !c.deleted)
      .sort((a,b)=> a.name.localeCompare(b.name));
  },
  getClient(name){
    return this.s.clients[(name||"").trim().toLowerCase()] || null;
  },
  saveClient(c){
    const k = c.name.trim().toLowerCase();
    if(!k) return null;
    const cur = this.s.clients[k] || { id:k, name:c.name.trim(), address:"", phone:"", contact:"", note:"", deleted:false };
    const row = Object.assign(cur, {
      id:k, name:c.name.trim(),
      address: c.address !== undefined ? c.address : cur.address,
      phone:   c.phone   !== undefined ? c.phone   : cur.phone,
      contact: c.contact !== undefined ? c.contact : cur.contact,
      note:    c.note    !== undefined ? c.note    : cur.note,
      updated_at: new Date().toISOString(), deleted:false
    });
    this.s.clients[k] = row; this.save(); Cloud.push([row], "clients");
    return row;
  },
  /* every visit for one client, newest first */
  historyFor(name){
    const k = (name||"").trim().toLowerCase();
    return this.live().filter(e => e.client.trim().toLowerCase() === k)
      .sort((a,b)=> b.work_date.localeCompare(a.work_date));
  },
  statsFor(name){
    const list = this.historyFor(name);
    return {
      visits: list.length,
      hours:  list.reduce((s,e)=> s + Number(e.hours), 0),
      miles:  list.reduce((s,e)=> s + MI.of(e), 0),
      open:   BILL.openHours(list),
      last:   list.length ? list[0].work_date : "",
      first:  list.length ? list[list.length-1].work_date : "",
      list
    };
  },
  /* last address we recorded for this client */
  addressFor(client){
    const rec = this.getClient(client);
    if(rec && rec.address) return rec.address;
    const k = (client||"").trim().toLowerCase();
    if(!k) return "";
    const hit = this.live()
      .filter(e => e.client.toLowerCase() === k && (e.address||"").trim())
      .sort((a,b)=> (b.work_date+b.updated_at).localeCompare(a.work_date+a.updated_at))[0];
    return hit ? hit.address : "";
  },
  mergeClients(rows){
    let n = 0;
    rows.forEach(r => {
      const cur = this.s.clients[r.id];
      if(!cur || (r.updated_at||"") > (cur.updated_at||"")){ this.s.clients[r.id] = r; n++; }
    });
    if(n) this.save();
    return n;
  },
  /* last odometer reading recorded anywhere */
  lastOdometer(){
    const hit = this.live()
      .filter(e => e.miles_end != null)
      .sort((a,b)=> (b.work_date+(b.updated_at||"")).localeCompare(a.work_date+(a.updated_at||"")))[0];
    return hit ? hit.miles_end : null;
  },
  merge(rows){
    let changed = 0;
    const byId = new Map(this.s.entries.map(e => [e.id, e]));
    rows.forEach(r => {
      const cur = byId.get(r.id);
      if(!cur){ this.s.entries.push(r); byId.set(r.id, r); changed++; }
      else if((r.updated_at||"") > (cur.updated_at||"")){ Object.assign(cur, r); changed++; }
    });
    if(changed) this.save();
    return changed;
  }
};

/* =========================================================
   CLOUD — plain REST against a shared Postgres table
   ========================================================= */
const Cloud = {
  state: "off",           // off | ok | err
  base(t){ return SUPA_URL + "/rest/v1/" + (t || "entries"); },
  head(extra){
    return Object.assign({
      "apikey": SUPA_KEY,
      "Authorization": "Bearer " + (Auth.token || SUPA_KEY),
      "Content-Type": "application/json"
    }, extra||{});
  },
  setState(s, msg){
    this.state = s;
    const d = document.getElementById("syncDot"), t = document.getElementById("syncTxt");
    if(!d) return;
    d.className = "syncdot" + (s==="ok" ? " live" : s==="err" ? " err" : "");
    t.textContent = msg || (s==="ok" ? "Synced" : s==="err" ? "Sync error" : "Local only");
  },
  async pull(){
    if(!DB.linked()) { this.setState("off"); return 0; }
    try{
      /* client records ride along, quietly */
      fetch(this.base("clients")+"?select=*", { headers: this.head() })
        .then(res => res.ok ? res.json() : [])
        .then(cs => DB.mergeClients(cs.map(c => ({
          id:c.id, name:c.name, address:c.address||"", phone:c.phone||"",
          contact:c.contact||"", note:c.note||"", updated_at:c.updated_at||"", deleted:!!c.deleted
        }))))
        .catch(()=>{});

      /* recurring subscriptions too */
      fetch(this.base("subs")+"?select=*", { headers: this.head() })
        .then(res => res.ok ? res.json() : [])
        .then(ss => DB.mergeSubs(ss.map(s => ({
          id:s.id, client:s.client, item:s.item||"", qty:Number(s.qty||1),
          unit_price:Number(s.unit_price||0), cycle:s.cycle||"monthly",
          next_due:s.next_due||"", last_billed:s.last_billed||"", note:s.note||"",
          active:s.active!==false, updated_at:s.updated_at||"", deleted:!!s.deleted
        }))))
        .catch(()=>{});

      const r = await fetch(this.base()+"?select=*", { headers: this.head() });
      if(!r.ok) throw new Error(await r.text());
      const rows = await r.json();
      const n = DB.merge(rows.map(x => ({
        id:x.id, work_date:x.work_date, client:x.client, hours:Number(x.hours),
        start_time:x.start_time||"", end_time:x.end_time||"",
        address:x.address||"",
        miles_start: x.miles_start==null ? null : Number(x.miles_start),
        miles_end:   x.miles_end==null   ? null : Number(x.miles_end),
        notes:x.notes||"", person:x.person||"", billed:x.billed||"unbilled",
        updated_at:x.updated_at||"", deleted:!!x.deleted
      })));
      this.setState("ok", "Synced · " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
      return n;
    }catch(err){ this.setState("err", "Sync error"); console.warn("pull", err); return 0; }
  },
  async push(rows, table){
    if(!DB.linked() || !rows.length) return;
    try{
      const r = await fetch(this.base(table), {
        method:"POST",
        headers: this.head({ "Prefer":"resolution=merge-duplicates,return=minimal" }),
        body: JSON.stringify(rows)
      });
      if(!r.ok) throw new Error(await r.text());
      this.setState("ok", "Synced · " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
    }catch(err){ this.setState("err","Sync error"); console.warn("push", err); }
  },
  async pushAll(){
    await this.push(DB.s.entries);
    await this.push(Object.values(DB.s.clients), "clients");
    await this.push(DB.s.subs, "subs");
  },
  async test(url, key){
    const r = await fetch(url.replace(/\/+$/,"")+"/rest/v1/entries?select=id&limit=1", {
      headers:{ apikey:key, Authorization:"Bearer "+key }
    });
    if(!r.ok) throw new Error((await r.text()) || ("HTTP "+r.status));
    return true;
  }
};

/* =========================================================
   DATES
   ========================================================= */
const D = {
  today(){ const d=new Date(); return D.iso(d); },
  iso(d){ return [d.getFullYear(), String(d.getMonth()+1).padStart(2,"0"), String(d.getDate()).padStart(2,"0")].join("-"); },
  parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y, m-1, d); },
  weekStart(date, startsOn){
    const d = new Date(date); const diff = (d.getDay() - startsOn + 7) % 7;
    d.setDate(d.getDate() - diff); d.setHours(0,0,0,0); return d;
  },
  addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; },
  short(d){ return d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); },
  dayLbl(s){ const d=D.parse(s); return d.toLocaleDateString(undefined,{weekday:"short",month:"numeric",day:"numeric"}); },
  full(s){ return D.parse(s).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"}); }
};

const hFmt = n => (Math.round(n*100)/100).toString().replace(/\.00$/,"").replace(/(\.\d)0$/,"$1");

/* clock helpers */
const T = {
  now(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); },
  mins(s,e){
    if(!s || !e) return null;
    const [sh,sm]=s.split(":").map(Number), [eh,em]=e.split(":").map(Number);
    let m = (eh*60+em) - (sh*60+sm);
    if(m < 0) m += 1440;          // ran past midnight
    return m;
  },
  round(m, step){
    if(!step) return m;
    const r = Math.round(m/step)*step;
    return (r === 0 && m > 0) ? step : r;
  },
  span(m){ const h=Math.floor(m/60), x=m%60; return (h?h+"h ":"") + (x?x+"m":(h?"":"0m")); },
  label(t){
    if(!t) return "";
    const [h,m]=t.split(":").map(Number);
    return new Date(2000,0,1,h,m).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  },
  range(a,b){ return (a&&b) ? T.label(a)+" – "+T.label(b) : ""; }
};

/* money */
const $m = n => "$" + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
const $r = n => "$" + Math.round(Number(n||0)).toLocaleString();

/* recurring subscriptions */
const SUB = {
  cycles: { monthly:1, quarterly:3, annual:12 },
  label:  { monthly:"Monthly", quarterly:"Quarterly", annual:"Annual" },
  per:    { monthly:"/mo", quarterly:"/qtr", annual:"/yr" },

  amount(s){ return Number(s.qty || 1) * Number(s.unit_price || 0); },
  monthly(s){ return SUB.amount(s) / (SUB.cycles[s.cycle] || 1); },
  yearly(s){ return SUB.monthly(s) * 12; },

  /* push a due date forward one cycle, keeping the day of month sane */
  advance(iso, cycle){
    const d = D.parse(iso);
    const day = d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + (SUB.cycles[cycle] || 1));
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, last));
    return D.iso(d);
  },

  daysUntil(iso){
    if(!iso) return 9999;
    const a = D.parse(D.today()), b = D.parse(iso);
    return Math.round((b - a) / 86400000);
  },

  state(s){
    if(!s.active) return "paused";
    const d = SUB.daysUntil(s.next_due);
    if(d < 0)  return "overdue";
    if(d <= 14) return "due";
    return "ok";
  },
  stateLabel: { overdue:"Overdue", due:"Due Soon", ok:"Scheduled", paused:"Paused" },

  badge(s){
    const st = SUB.state(s);
    const cls = st==="overdue" ? "partial" : st==="due" ? "partial" : st==="paused" ? "unbilled" : "billed";
    const extra = st==="overdue" ? ` ${Math.abs(SUB.daysUntil(s.next_due))}d late`
                : st==="due"     ? ` ${SUB.daysUntil(s.next_due)}d`
                : "";
    return `<span class="pill ${cls}"><i></i>${SUB.stateLabel[st]}${extra}</span>`;
  }
};

/* billing status */
const BILL = {
  order: ["unbilled","partial","billed"],
  label: { unbilled:"Unbilled", partial:"Partial", billed:"Billed" },
  of(e){ return BILL.order.includes(e.billed) ? e.billed : "unbilled"; },
  next(s){ return BILL.order[(BILL.order.indexOf(s) + 1) % BILL.order.length]; },
  pill(e){
    const s = BILL.of(e);
    return `<span class="pill ${s}"><i></i>${BILL.label[s]}</span>`;
  },
  /* the dropdown used on entry rows */
  select(e){
    const s = BILL.of(e);
    return `<select class="billsel ${s} noprint" data-billsel="${e.id}" title="Billing status">
      ${BILL.order.map(o=>`<option value="${o}"${o===s?" selected":""}>${BILL.label[o]}</option>`).join("")}
    </select>`;
  },
  /* wire every dropdown on the page */
  wire(root, after){
    root.querySelectorAll("[data-billsel]").forEach(sel => {
      sel.onclick = ev => ev.stopPropagation();
      sel.onchange = ev => {
        ev.stopPropagation();
        const row = DB.s.entries.find(x => x.id === sel.dataset.billsel);
        if(!row) return;
        DB.update(row.id, { billed: sel.value });
        UI.toast(row.client + " — " + BILL.label[sel.value]);
        if(after) after();
      };
    });
  },
  /* hours that still need invoicing (partial counts as outstanding) */
  openHours(list){ return list.filter(e => BILL.of(e) !== "billed").reduce((s,e)=> s + Number(e.hours), 0); }
};

/* odometer helpers */
const MI = {
  of(e){
    if(e.miles_start == null || e.miles_end == null) return 0;
    const d = Number(e.miles_end) - Number(e.miles_start);
    return d > 0 ? d : 0;
  },
  fmt(n){ return Number(n).toLocaleString(undefined,{maximumFractionDigits:1}); }
};
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* =========================================================
   UI
   ========================================================= */
const UI = {
  view: "log",
  weekOffset: 0,
  who: "",          /* "" = everyone */
  bill: "",         /* "" = any status, "open" = needs billing, "billed" = billed */
  draftHours: "",

  async boot(){
    DB.load();
    Auth.load();

    if(!Auth.signedIn()){ this.signInScreen(); return; }
    await Auth.ready();                 // refresh the token if it's stale
    if(!Auth.signedIn()){ this.signInScreen(); return; }
    this.start();
  },

  chrome(show){
    const d = show ? "" : "none";
    document.querySelector(".rail").style.display = d;
    document.querySelector(".mobtop").style.display = d;
    document.querySelector(".top").style.display = d;
  },

  signInScreen(msg){
    this.chrome(false);
    document.getElementById("view").innerHTML = `
      <div style="min-height:78vh;display:grid;place-items:center;padding:18px">
        <div class="panel" style="max-width:400px;width:100%">
          <div style="padding:28px 26px 6px">
            <div style="font-size:13px;letter-spacing:.14em;font-weight:700;color:var(--ink-3)">TN INFO TECH</div>
            <h2 style="font-size:22px;margin-top:6px;letter-spacing:-.02em">Job Log</h2>

              <div class="mb">
                <label class="f" for="si-email">Email</label>

                       inputmode="email" placeholder="you@tninfotech.com" required>

              <div class="mb">
                <label class="f" for="si-pass">Password</label>
                <input class="inp" id="si-pass" type="password" autocomplete="current-password" required>

                      style="width:100%;justify-content:center;padding:12px;font-size:15px">Sign In</button>

              Forgot password?
            </button>
          </div>

      </div>`;

    const msgBox = document.getElementById("siMsg");

    document.getElementById("siForm").onsubmit = async ev => {
      ev.preventDefault();
      const btn = document.getElementById("siGo");
      btn.disabled = true; btn.textContent = "Signing in…";
      msgBox.style.color = "var(--ink-3)"; msgBox.textContent = "";
      try{
        await Auth.signIn(document.getElementById("si-email").value,
                          document.getElementById("si-pass").value);
        if(!DB.s.person){
          const nm = Auth.email.split("@")[0].replace(/[._-]+/g," ");
          DB.s.person = nm.charAt(0).toUpperCase() + nm.slice(1);
          DB.save();
        }
        this.chrome(true);
        this.start();
        Cloud.pull().then(()=> this.render());
      }catch(err){
        btn.disabled = false; btn.textContent = "Sign In";
        msgBox.style.color = "#c0392b";
        msgBox.textContent = /invalid/i.test(err.message)
          ? "That email and password don't match."
          : err.message;
      }
    };

    document.getElementById("siForgot").onclick = async ()=>{
      const email = document.getElementById("si-email").value.trim();
      if(!email){ msgBox.style.color="#c0392b"; msgBox.textContent="Enter your email above first."; return; }
      try{
        await Auth.sendReset(email);
        msgBox.style.color = "var(--good)";
        msgBox.textContent = "Reset link sent — check " + email;
      }catch(e){
        msgBox.style.color = "#c0392b";
        msgBox.textContent = "Couldn't send the reset email.";
      }
    };

  start(){
    document.querySelectorAll("#nav button, #mobnav button").forEach(b => {
      b.addEventListener("click", () => this.go(b.dataset.v));
    });
    this.paintWho();
    this.go(DB.s.person ? "log" : "set");

    const sync = () => Auth.ready().then(ok => {
      if(!ok){ this.signInScreen("Your session expired — sign in again."); return; }
      Cloud.pull().then(()=>{ if(this.view!=="log") this.render(); });
    });
    sync();
    if(!this._syncTimer) this._syncTimer = setInterval(sync, 60000);
    window.addEventListener("focus", sync);
  },

  go(v){
    this.view = v;
    document.querySelectorAll("#nav button, #mobnav button").forEach(b => b.classList.toggle("on", b.dataset.v===v));
    this.render();
    window.scrollTo(0,0);

  paintWho(){
    const n = DB.s.person || "";
    document.getElementById("whoName").textContent = n || "Set your name";
    document.getElementById("avatar").textContent = n ? n.trim()[0].toUpperCase() : "?";
    Cloud.setState(DB.linked() ? (Cloud.state==="err"?"err":"ok") : "off", DB.linked()? undefined : "Local only");

  head(t, s, act){
    document.getElementById("ttl").textContent = t;
    document.getElementById("sub").textContent = s;
    document.getElementById("topAct").innerHTML = act || "";
  },

  toast(m){
    const t = document.getElementById("toast");
    t.textContent = m; t.classList.add("show");
    clearTimeout(this._tt); this._tt = setTimeout(()=>t.classList.remove("show"), 2200);
  },

  render(){
    const v = document.getElementById("view");
    if(this.view==="log")  { this.head("New Entry","Log where you were and what you did."); v.innerHTML = this.vLog(); this.wireLog(); }
    if(this.view==="week") { this.vWeek(v); }
    if(this.view==="clients"){ this.vClients(v); }
    if(this.view==="subs")   { this.vSubs(v); }
    if(this.view==="find") { this.head("History","Every job, searchable."); v.innerHTML = this.vFind(); this.wireFind(); }
    if(this.view==="set")  { this.head("Settings","Your name, and shared access for the crew."); v.innerHTML = this.vSet(); this.wireSet(); }

  wireLog(){
    const hours = document.getElementById("i-hours");
    const start = document.getElementById("i-start");
    const end   = document.getElementById("i-end");
    const calc  = document.getElementById("calc");

    /* mode switch */
    document.querySelectorAll("#modeSeg button").forEach(b => b.addEventListener("click", ()=>{
      DB.s.mode = b.dataset.m; DB.save();
      document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.toggle("on", x===b));
      document.getElementById("clockPane").style.display = b.dataset.m==="clock" ? "" : "none";
      document.getElementById("hoursPane").style.display = b.dataset.m==="hours" ? "" : "none";
    }));

    /* NOW stamps */
    document.querySelectorAll(".nowbtn").forEach(b => b.addEventListener("click", ()=>{
      const t = document.getElementById(b.dataset.now);
      t.value = T.now(); paint();
      if(b.dataset.now === "i-start" && !end.value) end.focus();
    }));

    /* live duration */
    const paint = () => {
      const m = T.mins(start.value, end.value);
      if(m === null || m === 0){
        calc.className = "calc";
        calc.innerHTML = "<b>—</b><span>Enter a start and end time</span>";
        return;
      }
      const billed = T.round(m, DB.s.round) / 60;
      const note = DB.s.round
        ? "actual " + T.span(m) + " · rounded to " + DB.s.round + " min"
        : "actual " + T.span(m);
      calc.className = "calc live";
      calc.innerHTML = "<b class='tnum'>" + hFmt(billed) + " h</b><span>" + note + "</span>";
    };
    start.addEventListener("input", paint);
    end.addEventListener("input", paint);
    paint();

    /* address remembered per client */
    const addr = document.getElementById("i-address");
    const client = document.getElementById("i-client");
    const fillAddr = () => {
      const known = DB.addressFor(client.value);
      if(known && !addr.dataset.touched) addr.value = known;
    };
    addr.addEventListener("input", ()=>{ addr.dataset.touched = addr.value ? "1" : ""; });
    client.addEventListener("change", fillAddr);
    client.addEventListener("blur", fillAddr);

    /* saved-client dropdown */
    const pickBtn = document.getElementById("pickBtn");
    if(pickBtn) pickBtn.addEventListener("click", ()=> this.pickClient(name => {
      client.value = name;
      addr.dataset.touched = "";
      addr.value = DB.addressFor(name);
      document.getElementById(DB.s.mode === "clock" ? "i-start" : "i-hours").focus();
    }));

    /* odometer */
    const ms = document.getElementById("i-mstart");
    const me = document.getElementById("i-mend");
    const mcalc = document.getElementById("mcalc");
    const lastOdo = document.getElementById("lastOdo");
    if(lastOdo) lastOdo.addEventListener("click", ()=>{ ms.value = DB.lastOdometer(); paintMiles(); me.focus(); });

    const paintMiles = () => {
      const a = ms.value === "" ? null : Number(ms.value);
      const b = me.value === "" ? null : Number(me.value);
      if(a === null || b === null){
        mcalc.className = "calc";
        mcalc.innerHTML = "<b>—</b><span>Enter both odometer readings</span>";
        return;
      }
      const d = b - a;
      if(d < 0){
        mcalc.className = "calc";
        mcalc.innerHTML = "<b style='font-size:14px;color:#c0392b'>End is lower than start</b><span>Check the readings</span>";
        return;
      }
      mcalc.className = "calc live";
      mcalc.innerHTML = "<b class='tnum'>" + MI.fmt(d) + " mi</b><span>round trip driven</span>";
    };
    ms.addEventListener("input", paintMiles);
    me.addEventListener("input", paintMiles);
    paintMiles();

    /* recurring add-on */
    const recur = document.getElementById("i-recur");
    const pane  = document.getElementById("recurPane");
    const rDue  = document.getElementById("r-due");
    const rCalc = document.getElementById("r-calc");

    const paintRecur = () => {
      const qty = Number(document.getElementById("r-qty").value||0);
      const pr  = Number(document.getElementById("r-price").value||0);
      const cy  = document.getElementById("r-cycle").value;
      const amt = qty * pr, mo = amt / SUB.cycles[cy];
      rCalc.className = "calc" + (amt ? " live" : "");
      rCalc.innerHTML = amt
        ? `<b class="tnum">${$m(amt)}</b><span>every ${SUB.label[cy].toLowerCase().replace("ly","")} · ${$m(mo)}/mo · ${$m(mo*12)}/yr</span>`
        : `<b>—</b><span>Enter quantity and price</span>`;
    };
    ["r-qty","r-price","r-cycle"].forEach(i => document.getElementById(i).addEventListener("input", paintRecur));
    document.getElementById("r-cycle").addEventListener("change", paintRecur);
    paintRecur();

    recur.addEventListener("change", ()=>{
      pane.style.display = recur.checked ? "" : "none";
      if(recur.checked){
        /* default the first renewal one cycle out from the work date */
        if(!rDue.value){
          const base = document.getElementById("i-date").value || D.today();
          rDue.value = SUB.advance(base, document.getElementById("r-cycle").value);
        }
        document.getElementById("r-item").focus();
      }
    });
    document.getElementById("r-cycle").addEventListener("change", ()=>{
      if(recur.checked){
        const base = document.getElementById("i-date").value || D.today();
        rDue.value = SUB.advance(base, document.getElementById("r-cycle").value);
      }
    });

    /* hours chips */
    document.querySelectorAll("#hchips .chip").forEach(c => c.addEventListener("click", ()=>{
      hours.value = c.dataset.h;
      document.querySelectorAll("#hchips .chip").forEach(x=>x.classList.toggle("on", x===c));
    }));
    hours.addEventListener("input", ()=> document.querySelectorAll("#hchips .chip").forEach(x=>x.classList.toggle("on", x.dataset.h===hours.value)));

    document.getElementById("f").addEventListener("submit", ev => {
      ev.preventDefault();
      const client = document.getElementById("i-client").value.trim();
      const date   = document.getElementById("i-date").value;
      const notes  = document.getElementById("i-notes").value.trim();
      if(!client || !date || !notes) return;

      let h = 0, s = "", e = "";
      if(DB.s.mode === "clock"){
        const m = T.mins(start.value, end.value);
        if(m === null){ this.toast("Add a start and end time"); start.focus(); return; }
        if(m === 0){ this.toast("Start and end are the same time"); return; }
        h = T.round(m, DB.s.round) / 60;
        s = start.value; e = end.value;
      } else {
        h = parseFloat(hours.value);
        if(!h){ this.toast("Enter the hours"); hours.focus(); return; }
      }

      const mStart = ms.value === "" ? "" : Number(ms.value);
      const mEnd   = me.value === "" ? "" : Number(me.value);
      if(mStart !== "" && mEnd !== "" && mEnd < mStart){ this.toast("End odometer is lower than start"); me.focus(); return; }
      const drove = (mStart !== "" && mEnd !== "") ? mEnd - mStart : 0;

      /* validate the recurring half before saving anything */
      let sub = null;
      if(recur.checked){
        const item = document.getElementById("r-item").value.trim();
        const price = Number(document.getElementById("r-price").value||0);
        if(!item){ this.toast("What renews? Name the subscription"); document.getElementById("r-item").focus(); return; }
        if(!price){ this.toast("Add a price for the subscription"); document.getElementById("r-price").focus(); return; }
        sub = {
          client, item,
          qty: Number(document.getElementById("r-qty").value||1),
          unit_price: price,
          cycle: document.getElementById("r-cycle").value,
          next_due: rDue.value || SUB.advance(date, document.getElementById("r-cycle").value),
          last_billed: "", note: "", active: true
        };
      }

      DB.add({ client, date, hours:h, notes, start:s, end:e,
               address: addr.value, milesStart:mStart, milesEnd:mEnd,
               billed: document.getElementById("i-billed").value });

      if(sub){
        DB.saveSub(sub);
        this.toast("Saved — " + client + " · " + hFmt(h) + "h · " + $m(SUB.amount(sub)) + SUB.per[sub.cycle] + " recurring");
      } else {
        this.toast("Saved — " + client + " · " + hFmt(h) + "h" + (drove ? " · " + MI.fmt(drove) + " mi" : ""));
      }
      this.render();

      document.getElementById("i-client").focus();
    });
    document.querySelectorAll("[data-edit]").forEach(b => b.onclick = ()=> this.editEntry(b.dataset.edit));
    document.getElementById("i-client").focus();
  },

  /* ---------- WEEK REPORT ---------- */
  weekRange(){
    const base = D.addDays(new Date(), this.weekOffset*7);
    const a = D.weekStart(base, DB.s.weekStart);
    const b = D.addDays(a, 6);
    return [a,b];
  },

  weekData(){
    const [a,b] = this.weekRange();
    const A = D.iso(a), B = D.iso(b);
    let rows = DB.live().filter(e => e.work_date >= A && e.work_date <= B);

    /* everything below respects the Trace / Joe / Everyone filter */
    const all = rows;
    if(this.who) rows = rows.filter(e => (e.person||"").trim().toLowerCase() === this.who.toLowerCase());

    /* the outstanding total is always for the whole week, regardless of the billing view */
    const billBase = rows;
    if(this.bill === "open")   rows = rows.filter(e => BILL.of(e) !== "billed");
    if(this.bill === "billed") rows = rows.filter(e => BILL.of(e) === "billed");

    /* per-person breakdown, always computed off the unfiltered week */
    const pm = new Map();
    all.forEach(e => {
      const p = (e.person||"").trim() || "Unassigned";
      if(!pm.has(p)) pm.set(p, { name:p, hours:0, miles:0, visits:0, days:new Set() });
      const g = pm.get(p);
      g.hours += Number(e.hours); g.miles += MI.of(e); g.visits++; g.days.add(e.work_date);
    });
    const byPerson = [...pm.values()].map(p => ({...p, days:p.days.size}))
                       .sort((x,y)=> y.hours - x.hours);

    const map = new Map();
    rows.forEach(e => {
      const k = e.client.toLowerCase();
      if(!map.has(k)) map.set(k, { name:e.client, hours:0, miles:0, address:"", list:[] });
      const g = map.get(k);
      g.hours += Number(e.hours);
      g.miles += MI.of(e);
      if(!g.address && (e.address||"").trim()) g.address = e.address;
      g.list.push(e);
    });
    const groups = [...map.values()].sort((x,y)=> y.hours - x.hours);
    groups.forEach(g => g.list.sort((x,y)=> x.work_date.localeCompare(y.work_date)));
    const total = rows.reduce((s,e)=> s + Number(e.hours), 0);
    const miles = rows.reduce((s,e)=> s + MI.of(e), 0);
    const days  = new Set(rows.map(e=>e.work_date)).size;
    return { a, b, rows, groups, total, miles, days, byPerson, allCount: all.length,
             openAll: BILL.openHours(billBase) };
  },

  reportText(){
    const w = this.weekData();
    const L = [];
    L.push("TN INFO TECH — WEEK OF " + D.short(w.a).toUpperCase() + " – " + D.short(w.b).toUpperCase());
    L.push(this.who ? this.who.toUpperCase() + " ONLY" : "ALL CREW");
    L.push(hFmt(w.total) + " hours · " + w.groups.length + " clients · " + w.days + " days"
           + (w.miles ? " · " + MI.fmt(w.miles) + " miles" : ""));
    if(!this.who && w.byPerson.length > 1){
      L.push("");
      w.byPerson.forEach(p => L.push("  " + p.name + ": " + hFmt(p.hours) + "h · " + p.visits + " jobs" + (p.miles ? " · " + MI.fmt(p.miles) + " mi" : "")));
    }
    L.push("");
    w.groups.forEach(g => {
      L.push(g.name.toUpperCase() + " — " + hFmt(g.hours) + "h" + (g.miles ? " · " + MI.fmt(g.miles) + " mi" : ""));
      if(g.address) L.push("  " + g.address);
      g.list.forEach(e => {
        const rng = T.range(e.start_time, e.end_time);
        const mi  = MI.of(e) ? " [" + MI.fmt(MI.of(e)) + " mi]" : "";
        const wh  = (!this.who && e.person) ? " {" + e.person + "}" : "";
        const bl  = BILL.of(e) === "billed" ? "" : " *" + BILL.label[BILL.of(e)].toUpperCase() + "*";
        L.push("  " + D.dayLbl(e.work_date) + (rng ? " " + rng : "") + " (" + hFmt(e.hours) + "h)" + mi + wh + bl + " " + e.notes.replace(/\s*\n\s*/g," "));
      });
      L.push("");
    });
    return L.join("\n").trim();
  },

  /* ---------- RECURRING SUBSCRIPTIONS ---------- */
  subFilter: "",

  vSubs(v){
    const all = DB.liveSubs();
    const active = all.filter(s => s.active);
    const mrr = active.reduce((t,s)=> t + SUB.monthly(s), 0);
    const clients = new Set(active.map(s => s.client.trim().toLowerCase())).size;
    const seats = active.reduce((t,s)=> t + Number(s.qty||0), 0);
    const dueSoon = active.filter(s => SUB.daysUntil(s.next_due) <= 14);
    const dueValue = dueSoon.reduce((t,s)=> t + SUB.amount(s), 0);

    this.head("Recurring", active.length + " active · " + $r(mrr) + "/mo · " + $r(mrr*12) + "/yr",
      `<button class="btn dark" id="sbNew">+ Add Subscription</button>`);

    let list = all.slice();
    if(this.subFilter === "due")    list = list.filter(s => s.active && SUB.daysUntil(s.next_due) <= 14);
    if(this.subFilter === "active") list = list.filter(s => s.active);
    if(this.subFilter === "paused") list = list.filter(s => !s.active);
    list.sort((a,b)=>{
      if(a.active !== b.active) return a.active ? -1 : 1;
      return (a.next_due||"9999").localeCompare(b.next_due||"9999");
    });

    /* group by client for the main table */
    const byClient = new Map();
    list.forEach(s => {
      const k = s.client.trim().toLowerCase();
      if(!byClient.has(k)) byClient.set(k, { name:s.client, rows:[], mo:0 });
      const g = byClient.get(k);
      g.rows.push(s);
      if(s.active) g.mo += SUB.monthly(s);
    });
    const groups = [...byClient.values()].sort((a,b)=> b.mo - a.mo);

    v.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">Monthly Recurring</div><div class="v tnum">${$r(mrr)}</div></div>
        <div class="stat"><div class="k">Annual Run Rate</div><div class="v tnum">${$r(mrr*12)}</div></div>
        <div class="stat"><div class="k">Active Subs</div><div class="v tnum">${active.length}</div></div>
        <div class="stat"><div class="k">Clients</div><div class="v tnum">${clients}</div></div>
        <div class="stat"><div class="k">Seats / Units</div><div class="v tnum">${seats.toLocaleString()}</div></div>

          <div class="grp open">

            </div>
            <div class="grp-b">
              ${g.rows.map(s=>`
                <div class="ent" style="align-items:center">
                  <div class="n" style="flex:1 1 auto">
                    <b style="font-weight:640;font-size:14px">${esc(s.item)}</b>
                    <div class="times" style="font-weight:500;margin-top:2px">
                      ${Number(s.qty)} × ${$m(s.unit_price)} · ${SUB.label[s.cycle]}

                      ${s.last_billed ? " · last billed " + esc(D.dayLbl(s.last_billed)) : ""}
                    </div>
                    ${s.note ? `<div class="times" style="font-weight:400;margin-top:3px">${esc(s.note)}</div>` : ""}
                  </div>
                  ${SUB.badge(s)}

    v.querySelectorAll("[data-billsub]").forEach(b => b.onclick = ()=> this.billSub(b.dataset.billsub));

      const csv = ["Client,Item,Qty,Unit Price,Cycle,Amount,Monthly Value,Next Due,Last Billed,Status,Notes"]

  billSub(id){
    const s = DB.liveSubs().find(x => x.id === id);
    if(!s) return;
    const nextDate = SUB.advance(s.next_due || D.today(), s.cycle);
    if(!confirm(`Mark ${s.client} — ${s.item} (${$m(SUB.amount(s))}) as billed?\n\nNext due date moves to ${D.full(nextDate)}.`)) return;
    DB.saveSub(Object.assign({}, s, { last_billed: D.today(), next_due: nextDate }));
    this.toast("Billed — next due " + D.dayLbl(nextDate));
    this.render();
  },

    this.modal("Edit Entry",
      `<div class="grid2 mb">

           <input class="inp" id="x-client" list="xcl" value="${esc(e.client)}" autocomplete="off">

         <div><label class="f" for="x-addr">Address</label>

       <div class="mb">
         <label class="f">Time</label>
         <div class="timerow">
           <div class="tf"><label class="f" for="x-start" style="font-size:11px">Start</label>
             <input class="inp" id="x-start" type="time" value="${esc(e.start_time||"")}" style="width:132px"></div>
           <div class="tf"><label class="f" for="x-end" style="font-size:11px">End</label>

           <div class="tf"><label class="f" for="x-hours" style="font-size:11px">Hours billed</label>
             <input class="inp tnum" id="x-hours" type="number" step="0.25" min="0" value="${e.hours}" style="width:118px"></div>
         </div>
         <div class="hint" id="x-tnote">Change the times and the hours recalculate. Or just type the hours directly.</div>
       </div>

       <div class="mb">
         <label class="f">Odometer</label>
         <div class="timerow">
           <div class="tf"><label class="f" for="x-ms" style="font-size:11px">Miles Start</label>
             <input class="inp tnum" id="x-ms" type="number" step="0.1" value="${e.miles_start==null?"":e.miles_start}" style="width:132px"></div>
           <div class="tf"><label class="f" for="x-me" style="font-size:11px">Miles End</label>
             <input class="inp tnum" id="x-me" type="number" step="0.1" value="${e.miles_end==null?"":e.miles_end}" style="width:132px"></div>
           <div class="calc" id="x-mcalc" style="min-width:150px"><b>—</b><span>No mileage</span></div>
         </div>
       </div>

       <div><label class="f" for="x-notes">What did you do?</label>
         <textarea class="inp" id="x-notes">${esc(e.notes)}</textarea></div>`,

      `<button class="btn" id="x-del" style="color:#c0392b;margin-right:auto">Delete Entry</button>
       <button class="btn" onclick="UI.closeModal()">Cancel</button>
       <button class="btn accent" id="x-save">Save Changes</button>`);

    const $ = i => document.getElementById(i);

    const recalc = () => {
      const m = T.mins($("x-start").value, $("x-end").value);
      if(m !== null && m !== 0){
        $("x-hours").value = hFmt(T.round(m, DB.s.round) / 60);
        $("x-tnote").textContent = "Recalculated from " + T.label($("x-start").value) + " – " + T.label($("x-end").value) + " (" + T.span(m) + " actual)";
      }
    };
    $("x-start").addEventListener("input", recalc);
    $("x-end").addEventListener("input", recalc);

    const paintM = () => {
      const a = $("x-ms").value === "" ? null : Number($("x-ms").value);
      const b = $("x-me").value === "" ? null : Number($("x-me").value);
      const box = $("x-mcalc");
      if(a === null || b === null){ box.className="calc"; box.innerHTML = "<b>—</b><span>No mileage</span>"; return; }
      if(b < a){ box.className="calc"; box.innerHTML = "<b style='font-size:13px;color:#c0392b'>End below start</b><span>Check readings</span>"; return; }
      box.className = "calc live";
      box.innerHTML = "<b class='tnum'>" + MI.fmt(b-a) + " mi</b><span>driven</span>";
    };
    $("x-ms").addEventListener("input", paintM);
    $("x-me").addEventListener("input", paintM);
    paintM();

    $("x-del").onclick = ()=>{
      if(!confirm("Delete this entry? This can't be undone.")) return;
      DB.remove(id); this.closeModal(); this.toast("Entry deleted"); this.render();
    };

    $("x-save").onclick = ()=>{
      const client = $("x-client").value.trim();
      const date   = $("x-date").value;
      const hours  = parseFloat($("x-hours").value);
      const notes  = $("x-notes").value.trim();
      if(!client || !date || !hours || !notes){ this.toast("Client, date, hours and notes are required"); return; }

      const ms = $("x-ms").value === "" ? null : Number($("x-ms").value);
      const me = $("x-me").value === "" ? null : Number($("x-me").value);
      if(ms !== null && me !== null && me < ms){ this.toast("End odometer is below start"); return; }

      DB.update(id, {
        client, work_date:date, hours, notes,
        address: $("x-addr").value.trim(),
        person: $("x-person").value.trim(),
        billed: $("x-billed").value,
        start_time: $("x-start").value, end_time: $("x-end").value,
        miles_start: ms, miles_end: me
      });
      this.closeModal(); this.toast("Entry updated"); this.render();
    };
  },

  /* ---------- HISTORY ---------- */
  vFind(){
    const cl = DB.clients();
    return `
      <div class="panel mb">
        <div class="panel-b">
          <div class="row">
            <div class="col" style="flex:2"><label class="f" for="q">Search</label>
              <input class="inp" id="q" placeholder="Client, or anything in the notes…" autocomplete="off"></div>
            <div class="col"><label class="f" for="qc">Client</label>

              <select class="inp" id="qp"><option value="">Everyone</option>${DB.people().map(p=>`<option>${esc(p)}</option>`).join("")}</select></div>

              <select class="inp" id="qb">
                <option value="">Any status</option>
                <option value="open">Needs billing</option>
                <option value="unbilled">Unbilled</option>
                <option value="partial">Partially billed</option>
                <option value="billed">Billed</option>
              </select></div>
            <div class="col"><label class="f" for="qs">Sort</label>
              <select class="inp" id="qs">
                <option value="new">Newest first</option>
                <option value="old">Oldest first</option>
                <option value="hrs">Most hours</option>
                <option value="bill">Unbilled first</option>
                <option value="billrev">Billed first</option>
              </select></div>
          </div>
        </div>
      </div>
      <div class="panel"><div class="panel-h"><h2 id="rc">All Entries</h2>
        <button class="btn sm" id="csv">Export CSV</button></div>
        <div id="rl"></div>
      </div>`;
  },

  wireFind(){
    const q=document.getElementById("q"), qc=document.getElementById("qc"), qs=document.getElementById("qs"),
          qp=document.getElementById("qp"), qb=document.getElementById("qb");
    const run = ()=>{
      const term=q.value.trim().toLowerCase(), cli=qc.value, sort=qs.value, per=qp.value, bill=qb.value;
      let rows = DB.live();
      if(cli) rows = rows.filter(e=>e.client===cli);
      if(per) rows = rows.filter(e=>(e.person||"").trim().toLowerCase()===per.toLowerCase());
      if(bill) rows = rows.filter(e => bill==="open" ? BILL.of(e)!=="billed" : BILL.of(e)===bill);
      if(term) rows = rows.filter(e=> (e.client+" "+e.notes+" "+(e.person||"")+" "+(e.address||"")).toLowerCase().includes(term));
      const rank = e => BILL.order.indexOf(BILL.of(e));
      rows.sort((a,b)=>
          sort==="hrs"     ? b.hours - a.hours
        : sort==="old"     ? a.work_date.localeCompare(b.work_date)
        : sort==="bill"    ? (rank(a) - rank(b)) || b.work_date.localeCompare(a.work_date)
        : sort==="billrev" ? (rank(b) - rank(a)) || b.work_date.localeCompare(a.work_date)
        :                    b.work_date.localeCompare(a.work_date));

      const hl = s => { const t=esc(s); if(!term) return t;
        return t.replace(new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>"); };

      const total = rows.reduce((s,e)=>s+Number(e.hours),0);
      const miles = rows.reduce((s,e)=>s+MI.of(e),0);
      const open = BILL.openHours(rows);
      document.getElementById("rc").textContent = rows.length + " entr" + (rows.length===1?"y":"ies") + " · " + hFmt(total) + "h"
        + (miles? " · "+MI.fmt(miles)+" mi" : "") + (open? " · " + hFmt(open) + "h to bill" : "");
      document.getElementById("rl").innerHTML = rows.length ? rows.map(e=>`
        <div class="res">
          <div class="meta"><b>${hl(e.client)}</b><span>${esc(D.dayLbl(e.work_date))}${e.person?" · "+esc(e.person):""}${T.range(e.start_time,e.end_time)?`<br>${esc(T.range(e.start_time,e.end_time))}`:""}${MI.of(e)?`<br>${MI.fmt(MI.of(e))} mi`:""}</span></div>
          <div class="txt">${e.address?`<div class="times" style="margin-bottom:4px">${hl(e.address)}</div>`:""}${hl(e.notes)}</div>
          <div class="hh tnum">${hFmt(e.hours)}h</div>
          ${BILL.select(e)}
          <button class="btn ghost sm" data-edit="${e.id}">Edit</button>
        </div>`).join("")
        : `<div class="empty"><b>Nothing found</b>${term?`No entries match “${esc(term)}”.`:"Log your first job to build history."}</div>`;

      document.querySelectorAll("#rl [data-edit]").forEach(b => b.onclick = ()=> this.editEntry(b.dataset.edit));
      BILL.wire(document.getElementById("rl"), run);
    };
    q.addEventListener("input",run); qc.addEventListener("change",run); qs.addEventListener("change",run); qp.addEventListener("change",run);
    document.getElementById("csv").onclick = ()=>{
      const rows = DB.live().slice().sort((a,b)=>a.work_date.localeCompare(b.work_date));
      const csv = ["Date,Client,Address,Start,End,Hours,Miles Start,Miles End,Miles Driven,Billing,Logged By,Notes"].concat(rows.map(e =>
        [e.work_date, e.client, e.address||"", T.label(e.start_time), T.label(e.end_time), e.hours,
         e.miles_start==null?"":e.miles_start, e.miles_end==null?"":e.miles_end, MI.of(e)||"",
         BILL.label[BILL.of(e)], e.person||"", e.notes]
          .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")
      )).join("\n");
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download="tn-info-tech-joblog-"+D.today()+".csv"; a.click();
      this.toast("CSV downloaded");
    };
    run();
  },

  /* ---------- SETTINGS ---------- */
  vSet(){
    const s = DB.s;
    return `
      <div class="panel mb">
        <div class="panel-h"><h2>Who Are You?</h2></div>
        <div class="panel-b">
          <div class="row">
            <div class="col" style="max-width:280px">
              <label class="f" for="s-name">Your name</label>
              <input class="inp" id="s-name" value="${esc(s.person)}" placeholder="Trace">
              <div class="hint">Stamped on every entry so you both know who did what.</div>
            </div>
            <div class="col" style="max-width:200px">
              <label class="f" for="s-ws">Week starts on</label>
              <select class="inp" id="s-ws">
                <option value="1"${s.weekStart===1?" selected":""}>Monday</option>
                <option value="0"${s.weekStart===0?" selected":""}>Sunday</option>
              </select>
            </div>
            <div class="col" style="max-width:240px">
              <label class="f" for="s-rd">Round clock time to</label>
              <select class="inp" id="s-rd">
                <option value="0"${s.round===0?" selected":""}>Exact — to the minute</option>
                <option value="15"${s.round===15?" selected":""}>Nearest 15 minutes</option>
                <option value="30"${s.round===30?" selected":""}>Nearest 30 minutes</option>
              </select>
              <div class="hint">10:15–11:29 bills as ${s.round===30?"1.5 h":s.round===15?"1.25 h":"1.23 h"}.</div>
            </div>
          </div>
          <button class="btn dark mt" id="s-save">Save</button>
        </div>
      </div>

      <div class="panel mb">
        <div class="panel-h"><h2>Account <span style="color:var(--good);font-weight:600;font-size:12px"> · Signed in</span></h2></div>
        <div class="panel-b">
          <dl class="kv" style="max-width:420px">
            <dt>Signed in as</dt><dd style="font-weight:600">${esc(Auth.email)}</dd>
            <dt>Sync</dt><dd id="s-syncline">Every entry saves to the shared TN Info Tech database.</dd>
          </dl>
          <div class="mt" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="a-pass">Change Password</button>
            <button class="btn ghost" id="a-out">Sign Out</button>
          </div>
          <div class="hint" id="a-msg"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>Your Data</h2></div>
        <div class="panel-b">
          <div style="font-size:14px;color:var(--ink-2);margin-bottom:12px">
            <b class="tnum">${DB.live().length}</b> entries · <b class="tnum">${hFmt(DB.live().reduce((a,e)=>a+Number(e.hours),0))}</b> hours · <b class="tnum">${MI.fmt(DB.live().reduce((a,e)=>a+MI.of(e),0))}</b> miles logged all-time
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="s-export">Download Backup</button>
            <button class="btn" id="s-import">Restore Backup</button>
            <input type="file" id="s-file" accept="application/json" hidden>
          </div>
        </div>
      </div>`;
  },

  wireSet(){
    document.getElementById("s-save").onclick = ()=>{
      DB.s.person = document.getElementById("s-name").value.trim();
      DB.s.weekStart = Number(document.getElementById("s-ws").value);
      DB.s.round = Number(document.getElementById("s-rd").value);
      DB.save(); this.paintWho(); this.toast("Saved"); this.render();
    };

    /* ---- account ---- */
    document.getElementById("a-out").onclick = async ()=>{
      if(!confirm("Sign out on this device? Your entries stay in the shared database.")) return;
      await Auth.signOut();
      this.signInScreen("Signed out.");
    };

    document.getElementById("a-pass").onclick = ()=>{
      this.modal("Change Password",
        `<div class="mb"><label class="f" for="np1">New password</label>
           <input class="inp" id="np1" type="password" autocomplete="new-password"></div>
         <div><label class="f" for="np2">Confirm</label>
           <input class="inp" id="np2" type="password" autocomplete="new-password"></div>
         <p class="hint">At least 8 characters.</p>`,
        `<button class="btn" onclick="UI.closeModal()">Cancel</button><button class="btn accent" id="npGo">Update Password</button>`);
      document.getElementById("npGo").onclick = async ()=>{
        const a = document.getElementById("np1").value, b = document.getElementById("np2").value;
        if(a.length < 8){ this.toast("Use at least 8 characters"); return; }
        if(a !== b){ this.toast("Passwords don't match"); return; }
        try{ await Auth.setPassword(a); this.closeModal(); this.toast("Password updated"); }
        catch(e){ this.toast(e.message); }
      };
    };

    document.getElementById("s-export").onclick = ()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify(DB.s.entries,null,2)],{type:"application/json"}));
      a.download="tn-joblog-backup-"+D.today()+".json"; a.click(); this.toast("Backup downloaded");
    };
    const file = document.getElementById("s-file");
    document.getElementById("s-import").onclick = ()=> file.click();
    file.onchange = ()=>{
      const f=file.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload = ()=>{
        try{
          const rows=JSON.parse(r.result);
          const n=DB.merge(rows); Cloud.push(rows);
          this.toast(n+" entries restored"); this.render();
        }catch(e){ alert("That file isn't a valid backup."); }
      };
      r.readAsText(f);
    };
  },

  modal(title, body, foot){
    document.getElementById("mTitle").textContent = title;
    document.getElementById("mBody").innerHTML = body;
    document.getElementById("mFoot").innerHTML = foot || "";
    document.getElementById("mask").classList.add("show");
  },
  closeModal(){ document.getElementById("mask").classList.remove("show"); }
};

document.getElementById("mask").addEventListener("click", e => { if(e.target.id==="mask") UI.closeModal(); });


UI.boot();

/* ---------------------------------------------------------
   Self-updater: if a newer build is on the server, take it.
   Kills the "I don't see the new field" cache problem.
   --------------------------------------------------------- */
const BUILD = document.querySelector('meta[name="build"]').content;
async function checkBuild(){
  try{
    const r = await fetch("index.html?cb=" + Date.now(), { cache:"no-store" });
    if(!r.ok) return;
    const html = await r.text();
    const m = html.match(/name="build" content="([^"]+)"/);
    if(m && m[1] !== BUILD){
      UI.toast("Updating to the latest version…");
      setTimeout(()=> location.replace(location.pathname + "?b=" + m[1]), 700);
    }
  }catch(e){}
}
checkBuild();
window.addEventListener("focus", checkBuild);
</script>
