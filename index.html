                  <span>${esc(D.parse(e.work_date).getFullYear())}${e.person?" · "+esc(e.person):""}
                  ${T.range(e.start_time,e.end_time)?`<br>${esc(T.range(e.start_time,e.end_time))}`:""}
                  ${MI.of(e)?`<br>${MI.fmt(MI.of(e))} mi`:""}</span>
                </div>
                <div class="txt">${esc(e.notes)}</div>
                <div class="hh tnum">${hFmt(e.hours)}h</div>
                ${BILL.select(e)}
                <button class="btn ghost sm" data-edit="${e.id}">Edit</button>
              </div>`).join("")
            : `<div class="empty"><b>Nothing logged here yet</b>Jobs you save for ${esc(c.name)} will stack up here.</div>`}
          </div>
        </div>
      </div>`;

    v.querySelectorAll("[data-edit]").forEach(b => b.onclick = ()=> this.editEntry(b.dataset.edit));
    BILL.wire(v, ()=> this.render());
    const cSub = document.getElementById("cSub");
    if(cSub) cSub.onclick = ()=>{
      this.editSub(null);
      const f = document.getElementById("b-client");
      if(f) f.value = c.name;
    };
    document.getElementById("cBack").onclick = ()=>{ this.openClient = null; this.render(); };
    document.getElementById("cEdit").onclick = ()=> this.editClient(c.name);
    document.getElementById("cLog").onclick  = ()=>{
      this.prefill = { client:c.name, address:c.address };
      this.openClient = null; this.go("log");
    };
    document.getElementById("cCopy").onclick = async ()=>{
      const L = [c.name.toUpperCase()];
      if(c.address) L.push(c.address);
      if(c.phone) L.push(c.phone);
      L.push(st.visits + " visits · " + hFmt(st.hours) + " hours" + (st.miles?" · "+MI.fmt(st.miles)+" miles":""), "");
      st.list.forEach(e=>{
        const rng = T.range(e.start_time,e.end_time);
        L.push(D.dayLbl(e.work_date) + "/" + D.parse(e.work_date).getFullYear() + (rng?" "+rng:"") + " (" + hFmt(e.hours) + "h) " + e.notes.replace(/\s*\n\s*/g," "));
      });
      const txt = L.join("\n");
      try{ await navigator.clipboard.writeText(txt); this.toast("Client history copied"); }
      catch(err){ this.modal(c.name, `<div class="rep">${esc(txt)}</div>`, `<button class="btn" onclick="UI.closeModal()">Done</button>`); }
    };
  },

  editClient(name){
    const c = DB.getClient(name) || { name:"", address:"", phone:"", contact:"", note:"" };
    const isNew = !name;
    const st = isNew ? null : DB.statsFor(name);
    const subCount = isNew ? 0 : DB.subsFor(name).length;
    this.modal(isNew ? "Add Client" : "Edit " + c.name,
      `<div class="mb"><label class="f" for="e-name">Client name</label>
         <input class="inp" id="e-name" value="${esc(c.name)}" placeholder="Riverbend Dental">
         ${isNew?"":`<div class="hint">Renaming updates all ${st.visits} job${st.visits===1?"":"s"}${subCount?` and ${subCount} subscription${subCount===1?"":"s"}`:""}. Type an existing client's name to merge them together.</div>`}</div>
       <div class="mb"><label class="f" for="e-addr">Address</label>
         <input class="inp" id="e-addr" value="${esc(c.address)}" placeholder="905 Gallatin Pike, Madison TN"></div>
       <div class="grid2 mb">
         <div><label class="f" for="e-contact">Contact person</label>
           <input class="inp" id="e-contact" value="${esc(c.contact)}" placeholder="Dr. Combs"></div>
         <div><label class="f" for="e-phone">Phone</label>
           <input class="inp" id="e-phone" value="${esc(c.phone)}" placeholder="615-555-0147"></div>
       </div>
       <div><label class="f" for="e-note">Notes about this client</label>
         <textarea class="inp" id="e-note" placeholder="Server closet is behind the front desk. Gate code 4412. Bill through the practice manager.">${esc(c.note)}</textarea></div>`,
      `${isNew?"":'<button class="btn" id="e-del" style="color:#c0392b;margin-right:auto">Delete</button>'}
       <button class="btn" onclick="UI.closeModal()">Cancel</button>
       <button class="btn accent" id="e-save">Save Client</button>`);

    document.getElementById("e-save").onclick = ()=>{
      const nm = document.getElementById("e-name").value.trim();
      if(!nm){ this.toast("Client needs a name"); return; }

      /* renaming onto an existing client merges the two */
      if(!isNew && nm.toLowerCase() !== c.name.toLowerCase()){
        const clash = DB.getClient(nm);
        const msg = clash
          ? `Merge ${c.name} into ${clash.name}?\n\n${st.visits} job${st.visits===1?"":"s"}${subCount?` and ${subCount} subscription${subCount===1?"":"s"}`:""} will move over, and ${c.name} goes away. This can't be undone.`
          : `Rename ${c.name} to ${nm}?\n\nThis updates ${st.visits} job${st.visits===1?"":"s"}${subCount?` and ${subCount} subscription${subCount===1?"":"s"}`:""}.`;
        if(!confirm(msg)) return;
        DB.renameClient(c.name, nm);
      }

      DB.saveClient({
        name: nm,
        address: document.getElementById("e-addr").value.trim(),
        contact: document.getElementById("e-contact").value.trim(),
        phone:   document.getElementById("e-phone").value.trim(),
        note:    document.getElementById("e-note").value.trim()
      });
      this.closeModal();
      this.openClient = nm;
      this.toast("Client saved");
      this.render();
    };

    const del = document.getElementById("e-del");
    if(del) del.onclick = ()=>{
      const warn = st.visits
        ? `Remove ${c.name} from your client list?\n\nTheir ${st.visits} logged job${st.visits===1?"":"s"} stay in the log and keep their history — you're only deleting the address book entry, so the address, phone and notes go away.`
        : `Remove ${c.name} from your client list?`;
      if(!confirm(warn)) return;
      DB.deleteClient(c.name);
      this.closeModal();
      this.openClient = null;
      this.toast(c.name + " removed");
      this.render();
    };
  },

  /* ---------- MONTH CALENDAR ---------- */
  monthOffset: 0,

  vCal(v){
    const base = new Date();
    base.setDate(1);
    base.setMonth(base.getMonth() + this.monthOffset);
    const year = base.getFullYear(), month = base.getMonth();
    const first = new Date(year, month, 1);
    const daysIn = new Date(year, month+1, 0).getDate();
    const mStart = D.iso(first), mEnd = D.iso(new Date(year, month, daysIn));

    let rows = DB.live().filter(e => e.work_date >= mStart && e.work_date <= mEnd);
    if(this.who) rows = rows.filter(e => (e.person||"").trim().toLowerCase() === this.who.toLowerCase());

    const hrs = rows.reduce((t,e)=> t + Number(e.hours||0), 0);
    const money = RATE.total(rows);
    const clients = new Set(rows.map(e=>e.client.toLowerCase())).size;
    const daysWorked = new Set(rows.map(e=>e.work_date)).size;
    const people = DB.people();

    const byDay = new Map();
    rows.forEach(e => { (byDay.get(e.work_date) || byDay.set(e.work_date, []).get(e.work_date)).push(e); });
    byDay.forEach(l => l.sort((a,b)=> (a.start_time||"~").localeCompare(b.start_time||"~")));

    /* pad out to whole weeks */
    const startPad = (first.getDay() - DB.s.weekStart + 7) % 7;
    const gridStart = D.addDays(first, -startPad);
    const cells = Math.ceil((startPad + daysIn) / 7) * 7;
    const today = D.today();
    const dow = [];
    for(let i=0;i<7;i++) dow.push(D.addDays(gridStart, i).toLocaleDateString(undefined,{weekday:"short"}));

    this.head(first.toLocaleDateString(undefined,{month:"long",year:"numeric"}),
      `${rows.length} job${rows.length===1?"":"s"} · ${hFmt(hrs)} hours · ${daysWorked} day${daysWorked===1?"":"s"} · ${clients} client${clients===1?"":"s"}${money?" · "+$r(money):""}`,
      `<div class="weekbar noprint">
         <button class="btn sm" id="mPrev">←</button>
         <span class="rng">${first.toLocaleDateString(undefined,{month:"short",year:"numeric"})}</span>
         <button class="btn sm" id="mNext">→</button>
         <button class="btn sm" id="mToday">This Month</button>
         <button class="btn sm" id="mPrint">Print</button>
       </div>`);

    let grid = "";
    for(let i=0;i<cells;i++){
      const d = D.addDays(gridStart, i), iso = D.iso(d);
      const out = d.getMonth() !== month;
      const list = byDay.get(iso) || [];
      const dh = list.reduce((t,e)=> t + Number(e.hours||0), 0);
      const shown = list.slice(0,3);
      grid += `
        <button class="mcell${out?" out":""}${iso===today?" today":""}" data-day="${iso}">
          <div style="display:flex;align-items:center;justify-content:space-between;width:100%;gap:4px">
            <span class="mnum">${d.getDate()}</span>
            ${dh?`<span class="mtot">${hFmt(dh)}h</span>`:""}
          </div>
          ${dh?`<span class="mdot"></span>`:""}
          ${shown.map(e=>`<span class="mchip ${BILL.of(e)}">${e.start_time?T.label(e.start_time).replace(/:00/,"")+" ":""}${esc(e.client)}</span>`).join("")}
          ${list.length>3?`<span class="mmore">+${list.length-3} more</span>`:""}
        </button>`;
    }

    v.innerHTML = `
      ${people.length>1?`
      <div class="noprint" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <span class="f" style="margin:0">Whose work</span>
        <div class="seg" id="calWho">
          <button data-w=""${this.who===""?" class='on'":""}>Everyone</button>
          ${people.map(p=>`<button data-w="${esc(p)}"${this.who===p?" class='on'":""}>${esc(p)}</button>`).join("")}
        </div>
      </div>`:""}

      <div class="stats">
        <div class="stat"><div class="k">Hours</div><div class="v tnum">${hFmt(hrs)}<small> h</small></div></div>
        <div class="stat"><div class="k">Labor</div><div class="v tnum">${$r(money)}</div></div>
        <div class="stat"><div class="k">Days Worked</div><div class="v tnum">${daysWorked}</div></div>
        <div class="stat"><div class="k">Clients</div><div class="v tnum">${clients}</div></div>
        <div class="stat${BILL.openHours(rows)?" warn":""}"><div class="k">Not Yet Billed</div><div class="v tnum">${hFmt(BILL.openHours(rows))}<small> h</small></div></div>
      </div>

      <div class="mgrid">
        ${dow.map(d=>`<div class="mdow">${d}</div>`).join("")}
        ${grid}
      </div>
      <p class="hint" style="margin-top:10px">Tap a day to see everything logged that day.</p>`;

    document.getElementById("mPrev").onclick  = ()=>{ this.monthOffset--; this.render(); };
    document.getElementById("mNext").onclick  = ()=>{ this.monthOffset++; this.render(); };
    document.getElementById("mToday").onclick = ()=>{ this.monthOffset = 0; this.render(); };
    document.getElementById("mPrint").onclick = ()=> window.print();
    const cw = document.getElementById("calWho");
    if(cw) cw.querySelectorAll("button").forEach(b => b.onclick = ()=>{ this.who = b.dataset.w; this.render(); });
    v.querySelectorAll("[data-day]").forEach(b => b.onclick = ()=> this.dayView(b.dataset.day));
  },

  /* one day, opened from the month grid */
  dayView(iso){
    let list = DB.live().filter(e => e.work_date === iso);
    if(this.who) list = list.filter(e => (e.person||"").trim().toLowerCase() === this.who.toLowerCase());
    list.sort((a,b)=> (a.start_time||"~").localeCompare(b.start_time||"~"));
    const hrs = list.reduce((t,e)=> t + Number(e.hours||0), 0);
    const money = RATE.total(list);

    this.modal(D.full(iso),
      list.length ? `
        <div style="font-size:13px;color:var(--ink-3);margin-bottom:12px">
          ${list.length} job${list.length===1?"":"s"} · ${hFmt(hrs)} hours${money?" · "+$m(money):""}
        </div>
        ${list.map(e=>`
          <div style="border:1px solid var(--line);border-radius:8px;padding:12px 13px;margin-bottom:8px">
            <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
              <b style="font-size:14.5px;font-weight:650">${esc(e.client)}</b>
              <span class="tnum" style="font-weight:660">${hFmt(e.hours)}h${RATE.amount(e)?" · "+$m(RATE.amount(e)):""}</span>
            </div>
            <div class="times" style="margin-top:3px">
              ${e.start_time?esc(T.range(e.start_time,e.end_time)||T.label(e.start_time))+" · ":""}${esc(BILL.label[BILL.of(e)])}${e.person?" · "+esc(e.person):""}
            </div>
            <div style="font-size:13.5px;color:var(--ink-2);margin-top:6px;white-space:pre-wrap">${esc(e.notes)}</div>
            <button class="btn ghost sm" data-dayedit="${e.id}" style="margin-top:8px">Edit</button>
          </div>`).join("")}`
        : `<div class="empty" style="padding:26px"><b>Nothing logged</b>No work recorded on this day.</div>`,
      `<button class="btn dark" onclick="UI.closeModal()">Close</button>`);

    document.querySelectorAll("[data-dayedit]").forEach(b => b.onclick = ()=>{
      const id = b.dataset.dayedit; this.closeModal(); this.editEntry(id);
    });
  },

  /* ---------- RECURRING SUBSCRIPTIONS ---------- */
  subFilter: "",

  vSubs(v){
    const all = DB.liveSubs();
    const active = all.filter(s => s.active);
    const mrr = active.reduce((t,s)=> t + SUB.monthly(s), 0);
    const mcost = active.reduce((t,s)=> t + SUB.monthlyCost(s), 0);
    const mprofit = mrr - mcost;
    const clients = new Set(active.map(s => s.client.trim().toLowerCase())).size;
    const seats = active.reduce((t,s)=> t + Number(s.qty||0), 0);
    const dueSoon = active.filter(s => SUB.daysUntil(s.next_due) <= 14);
    const dueValue = dueSoon.reduce((t,s)=> t + SUB.amount(s), 0);

    this.head("Recurring", active.length + " active · " + $r(mrr) + "/mo billed · " + $r(mprofit) + "/mo profit",
      `<button class="btn dark" id="sbNew">+ Add Subscription</button>`);

    let list = all.slice();
    if(this.subFilter === "due")    list = list.filter(s => s.active && SUB.daysUntil(s.next_due) <= 14);
    if(this.subFilter === "active") list = list.filter(s => s.active);
    if(this.subFilter === "paused") list = list.filter(s => !s.active);
    list.sort((a,b)=>{
      if(a.active !== b.active) return a.active ? -1 : 1;
      return (a.next_due||"9999").localeCompare(b.next_due||"9999");
    });

    /* group by client for the main table */
    const byClient = new Map();
    list.forEach(s => {
      const k = s.client.trim().toLowerCase();
      if(!byClient.has(k)) byClient.set(k, { name:s.client, rows:[], mo:0, prof:0 });
      const g = byClient.get(k);
      g.rows.push(s);
      if(s.active){ g.mo += SUB.monthly(s); g.prof += SUB.monthlyProfit(s); }
    });
    const groups = [...byClient.values()].sort((a,b)=> b.mo - a.mo);

    v.innerHTML = `
      <div class="stats">
        <div class="stat"><div class="k">Billed / mo</div><div class="v tnum">${$r(mrr)}</div></div>
        <div class="stat"><div class="k">Our Cost / mo</div><div class="v tnum" style="color:var(--ink-3)">${$r(mcost)}</div></div>
        <div class="stat"><div class="k">Profit / mo</div><div class="v tnum" style="color:var(--good)">${$r(mprofit)}</div></div>
        <div class="stat"><div class="k">Profit / yr</div><div class="v tnum" style="color:var(--good)">${$r(mprofit*12)}</div></div>
        <div class="stat"><div class="k">Margin</div><div class="v tnum">${mrr?Math.round((mprofit/mrr)*100):0}<small>%</small></div></div>
        <div class="stat"><div class="k">Active · Clients</div><div class="v tnum">${active.length}<small> · ${clients}</small></div></div>
        <div class="stat"><div class="k">Seats / Units</div><div class="v tnum">${seats.toLocaleString()}</div></div>
        <div class="stat${dueSoon.length?" warn":""}"><div class="k">Due Now</div><div class="v tnum">${$r(dueValue)}</div></div>
      </div>

      ${dueSoon.length ? `
      <div class="panel mb">
        <div class="panel-h"><h2>Ready to Bill</h2><span class="hint" style="margin:0">${dueSoon.length} due or overdue · ${$m(dueValue)}</span></div>
        ${dueSoon.sort((a,b)=>(a.next_due||"").localeCompare(b.next_due||"")).map(s=>`
          <div class="subrow">
            <div class="who">
              <div class="nm2">${esc(s.client)}</div>
              <div class="meta2">${esc(s.item)} · due ${esc(D.due(s.next_due))}</div>
            </div>
            ${SUB.badge(s)}
            <div class="amt tnum">${$m(SUB.amount(s))}<small>${SUB.per[s.cycle]}</small></div>
            <button class="btn sm accent act noprint" data-billsub="${s.id}">Mark Billed</button>
          </div>`).join("")}
      </div>` : ""}

      <div class="noprint" style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <span class="f" style="margin:0">Show</span>
        <div class="seg" id="subSeg">
          <button data-s=""${this.subFilter===""?" class='on'":""}>All</button>
          <button data-s="due"${this.subFilter==="due"?" class='on'":""}>Due Soon</button>
          <button data-s="active"${this.subFilter==="active"?" class='on'":""}>Active</button>
          <button data-s="paused"${this.subFilter==="paused"?" class='on'":""}>Paused</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>All Subscriptions</h2><button class="btn sm" id="sbCsv">Export CSV</button></div>
        ${groups.length ? groups.map(g=>`
          <div>
            <div class="subhead">
              <span class="nm2">${esc(g.name)}</span>
              <span class="ct" style="font-size:12px;color:var(--ink-3)">${g.rows.length} item${g.rows.length===1?"":"s"}</span>
              <span class="tnum" style="font-weight:680;font-size:15px">${$r(g.mo)}<small style="font-size:11px;font-weight:600;color:var(--ink-3)">/mo</small>${g.prof?`<small style="font-size:11px;font-weight:600;color:var(--good)"> · ${$r(g.prof)} profit</small>`:""}</span>
            </div>
            ${g.rows.map(s=>`
              <div class="subrow">
                <div class="who">
                  <div class="nm2">${esc(s.item)}</div>
                  <div class="meta2">
                    ${Number(s.qty)} × ${$m(s.unit_price)} · ${SUB.label[s.cycle]}${s.next_due ? " · next " + esc(D.due(s.next_due)) : ""}${s.last_billed ? " · billed " + esc(D.due(s.last_billed)) : ""}${s.note ? " · " + esc(s.note) : ""}
                    ${SUB.cost(s) ? `<span style="color:var(--good);font-weight:600"> · ${$m(SUB.profit(s))} profit (${Math.round(SUB.margin(s))}%)</span>` : ""}
                  </div>
                </div>
                ${SUB.badge(s)}
                <div class="amt tnum">${$m(SUB.amount(s))}<small>${SUB.per[s.cycle]}</small></div>
                <button class="btn ghost sm act noprint" data-editsub="${s.id}">Edit</button>
              </div>`).join("")}
          </div>`).join("")
        : `<div class="empty"><b>No subscriptions yet</b>Add the Microsoft 365 tenants, backup plans, and anything else you rebill monthly, quarterly, or yearly.</div>`}
      </div>`;

    document.getElementById("sbNew").onclick = ()=> this.editSub(null);
    v.querySelectorAll("#subSeg button").forEach(b => b.onclick = ()=>{ this.subFilter = b.dataset.s; this.render(); });
    v.querySelectorAll("[data-editsub]").forEach(b => b.onclick = ()=> this.editSub(b.dataset.editsub));
    v.querySelectorAll("[data-billsub]").forEach(b => b.onclick = ()=> this.billSub(b.dataset.billsub));

    document.getElementById("sbCsv").onclick = ()=>{
      const rows = DB.liveSubs().slice().sort((a,b)=> a.client.localeCompare(b.client));
      const csv = ["Client,Item,Qty,Client Price,Our Cost,Cycle,Billed,Cost,Profit,Margin %,Monthly Billed,Monthly Profit,Next Due,Last Billed,Status,Notes"]
        .concat(rows.map(s => [
          s.client, s.item, s.qty, s.unit_price, s.unit_cost||0, SUB.label[s.cycle],
          SUB.amount(s).toFixed(2), SUB.cost(s).toFixed(2), SUB.profit(s).toFixed(2), Math.round(SUB.margin(s)),
          SUB.monthly(s).toFixed(2), SUB.monthlyProfit(s).toFixed(2),
          s.next_due||"", s.last_billed||"", s.active?"Active":"Paused", s.note||""
        ].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(","))).join("\n");
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download="tn-recurring-"+D.today()+".csv"; a.click();
      this.toast("CSV downloaded");
    };
  },

  billSub(id){
    const s = DB.liveSubs().find(x => x.id === id);
    if(!s) return;
    const nextDate = SUB.advance(s.next_due || D.today(), s.cycle);
    if(!confirm(`Mark ${s.client} — ${s.item} (${$m(SUB.amount(s))}) as billed?\n\nNext due date moves to ${D.full(nextDate)}.`)) return;
    DB.saveSub(Object.assign({}, s, { last_billed: D.today(), next_due: nextDate }));
    this.toast("Billed — next due " + D.dayLbl(nextDate));
    this.render();
  },

      `<div class="grid2 mb">

         <div><label class="f" for="b-item">What is it</label>

             <option value="Microsoft 365 Business Basic"><option value="Microsoft 365 Business Standard">

             <option value="Website Hosting"><option value="Domain Renewal"><option value="Managed Services">
           </datalist></div>
       </div>

       <div class="grid2 mb">

      `${s ? '<button class="btn" id="b-del" style="color:#c0392b;margin-right:auto">Delete</button>' : ""}
       <button class="btn" onclick="UI.closeModal()">Cancel</button>
       <button class="btn accent" id="b-save">${s ? "Save" : "Add Subscription"}</button>`);

    const $ = i => document.getElementById(i);
    const paint = () => {
      const qty = Number($("b-qty").value||0), pr = Number($("b-price").value||0),
            ct = Number($("b-cost").value||0), cy = $("b-cycle").value;
      const amt = qty*pr, cost = qty*ct, profit = amt - cost;
      const mo = amt / SUB.cycles[cy], moP = profit / SUB.cycles[cy];

      $("b-calc").className = "calc" + (amt ? " live" : "");
      $("b-calc").innerHTML = amt
        ? `<b class="tnum">${$m(profit)} profit</b>
           <span>${$m(amt)} billed − ${$m(cost)} cost · ${pct}% margin<br>
           ${$m(mo)}/mo in · ${$m(moP)}/mo profit · ${$m(moP*12)}/yr profit</span>`
        : `<b>—</b><span>Enter quantity and price</span>`;
    };
    ["b-qty","b-price","b-cost","b-cycle"].forEach(i => $(i).addEventListener("input", paint));
    $("b-cycle").addEventListener("change", paint);
    paint();

    if($("b-del")) $("b-del").onclick = ()=>{
      if(!confirm("Delete this subscription? It stops counting toward your totals.")) return;
      DB.removeSub(s.id); this.closeModal(); this.toast("Subscription deleted"); this.render();
    };

    $("b-save").onclick = ()=>{
      const client = $("b-client").value.trim(), item = $("b-item").value.trim();
      if(!client || !item){ this.toast("Client and item are required"); return; }
      DB.saveSub({
        id: s ? s.id : undefined,
        client, item,
        qty: Number($("b-qty").value||1),
        unit_price: Number($("b-price").value||0),
        unit_cost: Number($("b-cost").value||0),

      this.closeModal(); this.toast(s ? "Subscription saved" : "Subscription added"); this.render();

  /* ---------- APPLY A RATE TO MANY PAST JOBS ---------- */
  bulkRate(){
    const now = new Date();
    const ranges = {
      week:  [D.iso(D.weekStart(now, DB.s.weekStart)), D.today()],
      month: [D.iso(new Date(now.getFullYear(), now.getMonth(), 1)), D.today()],
      year:  [D.iso(new Date(now.getFullYear(), 0, 1)), D.today()],
      all:   ["0000-01-01", "9999-12-31"]
    };

    this.modal("Set Hourly Rate on Past Jobs",
      `<div class="grid2 mb">
         <div><label class="f" for="bk-rate">Hourly rate</label>
           <input class="inp tnum" id="bk-rate" type="number" step="1" min="0" value="${DB.s.rate||""}" placeholder="95"></div>
         <div><label class="f" for="bk-scope">Apply to</label>
           <select class="inp" id="bk-scope">
             <option value="week">This week</option>
             <option value="month">This month</option>
             <option value="year" selected>This year</option>
             <option value="all">Everything</option>
           </select></div>
       </div>
       <div class="mb"><label class="f" for="bk-client">Client</label>
         <select class="inp" id="bk-client">
           <option value="">All clients</option>
           ${DB.clientList().map(c=>`<option>${esc(c.name)}</option>`).join("")}
         </select></div>
       <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;margin-bottom:12px">
         <input type="checkbox" id="bk-only" checked style="width:15px;height:15px">
         Only jobs that don't have a rate yet
       </label>
       <div class="calc" id="bk-calc" style="min-width:0"></div>
       <p class="hint">Leaving the box ticked is the safe choice — it won't overwrite rates you've already set.</p>`,
      `<button class="btn" onclick="UI.closeModal()">Cancel</button>
       <button class="btn accent" id="bk-go">Apply Rate</button>`);

    const $ = i => document.getElementById(i);
    const targets = () => {
      const [a,b] = ranges[$("bk-scope").value];
      const cli = $("bk-client").value;
      return DB.live().filter(e =>
        e.work_date >= a && e.work_date <= b &&
        (!cli || e.client === cli) &&
        (!$("bk-only").checked || !RATE.of(e)));
    };
    const paint = () => {
      const r = Number($("bk-rate").value||0), list = targets();
      const hrs = list.reduce((t,e)=> t + Number(e.hours||0), 0);
      $("bk-calc").className = "calc" + (r && list.length ? " live" : "");
      $("bk-calc").innerHTML = list.length
        ? `<b class="tnum">${list.length} job${list.length===1?"":"s"}${r?` · ${$m(hrs*r)}`:""}</b><span>${hFmt(hrs)} hours${r?` × ${$m(r)}/hr`:" — enter a rate"}</span>`
        : `<b>—</b><span>No jobs match that</span>`;
    };
    ["bk-rate","bk-scope","bk-client","bk-only"].forEach(i => {
      $(i).addEventListener("input", paint); $(i).addEventListener("change", paint);
    });
    paint();

    $("bk-go").onclick = ()=>{
      const r = Number($("bk-rate").value||0);
      if(!r){ this.toast("Enter an hourly rate"); return; }
      const list = targets();
      if(!list.length){ this.toast("No jobs match that"); return; }
      const hrs = list.reduce((t,e)=> t + Number(e.hours||0), 0);
      if(!confirm(`Set ${$m(r)}/hr on ${list.length} job${list.length===1?"":"s"}?\n\n${hFmt(hrs)} hours → ${$m(hrs*r)}`)) return;
      list.forEach(e => DB.update(e.id, { rate: r }));
      DB.s.rate = r; DB.save();
      this.closeModal();
      this.toast(list.length + " jobs priced — " + $m(hrs*r));
      this.render();
    };
  },

      const a = $("x-ms").value === "" ? null : Number($("x-ms").value);
      const b = $("x-me").value === "" ? null : Number($("x-me").value);

    $("x-ms").addEventListener("input", paintM);
    $("x-me").addEventListener("input", paintM);

          ? `<b class="tnum">${$m(amt)}</b><span>every ${SUB.label[cy].toLowerCase().replace("ly","")} · ${$m(mo)}/mo · ${$m(mo*12)}/yr</span>`
          : `<b>—</b><span>Enter quantity and price</span>`;

      rc.addEventListener("change", ()=>{
        rp.style.display = rc.checked ? "" : "none";
        if(rc.checked){ if(!$("xr-due").value) refreshDue(); $("xr-item").focus(); }
      });
      $("xr-cycle").addEventListener("change", ()=>{ if(rc.checked) refreshDue(); paintR(); });

      DB.remove(id); this.closeModal(); this.toast("Entry deleted"); this.render();
    };

    $("x-save").onclick = ()=>{
      const client = $("x-client").value.trim();
      const date   = $("x-date").value;
      const hours  = parseFloat($("x-hours").value);
      const notes  = $("x-notes").value.trim();
      if(!client || !date || !hours || !notes){ this.toast("Client, date, hours and notes are required"); return; }

      const ms = $("x-ms").value === "" ? null : Number($("x-ms").value);
      const me = $("x-me").value === "" ? null : Number($("x-me").value);
      if(ms !== null && me !== null && me < ms){ this.toast("End odometer is below start"); return; }

      /* create the subscription if they ticked the box */
      let newSubId = null;
      if(!linked && $("x-recur") && $("x-recur").checked){
        const item = $("xr-item").value.trim();
        const price = Number($("xr-price").value||0);
        if(!item){ this.toast("What renews? Name the subscription"); $("xr-item").focus(); return; }
        if(!price){ this.toast("Add a price for the subscription"); $("xr-price").focus(); return; }
        const made = DB.saveSub({
          client, item,
          qty: Number($("xr-qty").value||1),
          unit_price: price,
          cycle: $("xr-cycle").value,
          next_due: $("xr-due").value || SUB.advance(date, $("xr-cycle").value),
          last_billed: "", note: "", active: true
        });
        newSubId = made.id;
      }

      DB.update(id, {
        client, work_date:date, hours, notes,
        sub_id: newSubId || e.sub_id || null,
        rate: $("x-rate") ? Number($("x-rate").value || 0) : RATE.of(e),
        address: $("x-addr").value.trim(),
        person: $("x-person").value.trim(),
        billed: $("x-billed").value,
        start_time: $("x-start").value, end_time: $("x-end").value,
        miles_start: ms, miles_end: me
      });
      this.closeModal();
      this.toast(newSubId ? "Entry updated · subscription added to Recurring" : "Entry updated");
      this.render();
    };
  },

  /* client picker used from the entry form */
  pickClient(onPick){
    const list = DB.clientList().map(c => Object.assign({}, c, DB.statsFor(c.name)))
                   .sort((a,b)=> (b.last||"").localeCompare(a.last||""));
    if(!list.length){ this.toast("No saved clients yet"); return; }

    this.modal("Choose a Client",
      `<input class="inp" id="pkq" placeholder="Type to filter…" autocomplete="off">
       <div class="pick" id="pkl"></div>`, "");

    const draw = (term="") => {
      const t = term.toLowerCase();
      const rows = list.filter(c => (c.name+" "+c.address).toLowerCase().includes(t));
      document.getElementById("pkl").innerHTML = rows.length ? rows.map(c=>`
        <button data-p="${esc(c.name)}">
          <b>${esc(c.name)}</b>
          <span>${esc(c.address || "No address")} · ${c.visits} visit${c.visits===1?"":"s"} · ${hFmt(c.hours)}h${c.last?" · last "+esc(D.dayLbl(c.last)):""}</span>
        </button>`).join("")
        : `<div class="empty" style="padding:26px">No match</div>`;
      document.querySelectorAll("#pkl [data-p]").forEach(b => b.onclick = ()=>{
        this.closeModal(); onPick(b.dataset.p);
      });
    };
    document.getElementById("pkq").addEventListener("input", e => draw(e.target.value));
    draw();
    document.getElementById("pkq").focus();
  },

        </div>
      </div>
      <div class="panel"><div class="panel-h"><h2 id="rc">All Entries</h2>
        <button class="btn sm" id="csv">Export CSV</button></div>
        <div id="rl"></div>
      </div>`;
  },

  wireFind(){
    const q=document.getElementById("q"), qc=document.getElementById("qc"), qs=document.getElementById("qs"),
          qp=document.getElementById("qp"), qb=document.getElementById("qb");
    const run = ()=>{
      const term=q.value.trim().toLowerCase(), cli=qc.value, sort=qs.value, per=qp.value, bill=qb.value;
      let rows = DB.live();
      if(cli) rows = rows.filter(e=>e.client===cli);
      if(per) rows = rows.filter(e=>(e.person||"").trim().toLowerCase()===per.toLowerCase());
      if(bill) rows = rows.filter(e => bill==="open" ? BILL.open(e) : BILL.of(e)===bill);
      if(term) rows = rows.filter(e=> (e.client+" "+e.notes+" "+(e.person||"")+" "+(e.address||"")).toLowerCase().includes(term));
      const rank = e => BILL.order.indexOf(BILL.of(e));
      rows.sort((a,b)=>
          sort==="hrs"     ? b.hours - a.hours
        : sort==="old"     ? a.work_date.localeCompare(b.work_date)
        : sort==="bill"    ? (rank(a) - rank(b)) || b.work_date.localeCompare(a.work_date)
        : sort==="billrev" ? (rank(b) - rank(a)) || b.work_date.localeCompare(a.work_date)
        :                    b.work_date.localeCompare(a.work_date));

      const hl = s => { const t=esc(s); if(!term) return t;
        return t.replace(new RegExp("("+term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"), "<mark>$1</mark>"); };

      const total = rows.reduce((s,e)=>s+Number(e.hours),0);
      const miles = rows.reduce((s,e)=>s+MI.of(e),0);
      const open = BILL.openHours(rows);
      document.getElementById("rc").textContent = rows.length + " entr" + (rows.length===1?"y":"ies") + " · " + hFmt(total) + "h"
        + (miles? " · "+MI.fmt(miles)+" mi" : "") + (RATE.total(rows)? " · " + $r(RATE.total(rows)) : "") + (open? " · " + hFmt(open) + "h to bill" : "");
      document.getElementById("rl").innerHTML = rows.length ? rows.map(e=>`
        <div class="res">
          <div class="meta"><b>${hl(e.client)}</b><span>${esc(D.dayLbl(e.work_date))}${e.person?" · "+esc(e.person):""}${T.range(e.start_time,e.end_time)?`<br>${esc(T.range(e.start_time,e.end_time))}`:""}${MI.of(e)?`<br>${MI.fmt(MI.of(e))} mi`:""}</span></div>
          <div class="txt">${e.address?`<div class="times" style="margin-bottom:4px">${hl(e.address)}</div>`:""}${hl(e.notes)}</div>
          <div class="hh tnum">${hFmt(e.hours)}h${RATE.amount(e)?`<small style="display:block;font-size:11px;font-weight:600;color:var(--ink-3)">${$m(RATE.amount(e))}</small>`:""}</div>
          ${BILL.select(e)}
          <button class="btn ghost sm" data-edit="${e.id}">Edit</button>
        </div>`).join("")
        : `<div class="empty"><b>Nothing found</b>${term?`No entries match “${esc(term)}”.`:"Log your first job to build history."}</div>`;

      document.querySelectorAll("#rl [data-edit]").forEach(b => b.onclick = ()=> this.editEntry(b.dataset.edit));
      BILL.wire(document.getElementById("rl"), run);
    };
    q.addEventListener("input",run); qc.addEventListener("change",run); qs.addEventListener("change",run); qp.addEventListener("change",run);
    document.getElementById("csv").onclick = ()=>{
      const rows = DB.live().slice().sort((a,b)=>a.work_date.localeCompare(b.work_date));
      const csv = ["Date,Client,Address,Start,End,Hours,Rate,Amount,Miles Start,Miles End,Miles Driven,Billing,Logged By,Notes"].concat(rows.map(e =>
        [e.work_date, e.client, e.address||"", T.label(e.start_time), T.label(e.end_time), e.hours,
         RATE.of(e)||"", RATE.amount(e)?RATE.amount(e).toFixed(2):"",
         e.miles_start==null?"":e.miles_start, e.miles_end==null?"":e.miles_end, MI.of(e)||"",
         BILL.label[BILL.of(e)], e.person||"", e.notes]
          .map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")
      )).join("\n");
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
      a.download="tn-info-tech-joblog-"+D.today()+".csv"; a.click();
      this.toast("CSV downloaded");
    };
    run();
  },

  /* ---------- SETTINGS ---------- */
  vSet(){
    const s = DB.s;
    return `
      <div class="panel mb">
        <div class="panel-h"><h2>Who Are You?</h2></div>
        <div class="panel-b">
          <div class="row">
            <div class="col" style="max-width:280px">
              <label class="f" for="s-name">Your name</label>
              <input class="inp" id="s-name" value="${esc(s.person)}" placeholder="Trace">
              <div class="hint">Stamped on every entry so you both know who did what.</div>
            </div>
            <div class="col" style="max-width:200px">
              <label class="f" for="s-ws">Week starts on</label>
              <select class="inp" id="s-ws">
                <option value="1"${s.weekStart===1?" selected":""}>Monday</option>
                <option value="0"${s.weekStart===0?" selected":""}>Sunday</option>
              </select>
            </div>
            <div class="col" style="max-width:180px">
              <label class="f" for="s-rate">Default hourly rate</label>
              <input class="inp tnum" id="s-rate" type="number" step="1" min="0" value="${s.rate||""}" placeholder="0">
              <div class="hint">Pre-filled on every new job.</div>
            </div>
            <div class="col" style="max-width:240px">
              <label class="f" for="s-rd">Round clock time to</label>
              <select class="inp" id="s-rd">
                <option value="0"${s.round===0?" selected":""}>Exact — to the minute</option>
                <option value="15"${s.round===15?" selected":""}>Nearest 15 minutes</option>
                <option value="30"${s.round===30?" selected":""}>Nearest 30 minutes</option>
              </select>
              <div class="hint">10:15–11:29 bills as ${s.round===30?"1.5 h":s.round===15?"1.25 h":"1.23 h"}.</div>
            </div>
          </div>
          <button class="btn dark mt" id="s-save">Save</button>
        </div>
      </div>

      <div class="panel mb">
        <div class="panel-h"><h2>Account <span style="color:var(--good);font-weight:600;font-size:12px"> · Signed in</span></h2></div>
        <div class="panel-b">
          <dl class="kv" style="max-width:420px">
            <dt>Signed in as</dt><dd style="font-weight:600">${esc(Auth.email)}</dd>
            <dt>Sync</dt><dd id="s-syncline">Every entry saves to the shared TN Info Tech database.</dd>
          </dl>
          <div class="mt" style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="a-pass">Change Password</button>
            <button class="btn ghost" id="a-out">Sign Out</button>
            <button class="btn ghost" id="a-outall" style="color:#c0392b">Sign Out Everywhere</button>
          </div>
          <div class="hint">Signing out erases this device's local copy. <b>Sign Out Everywhere</b> ends the session on every phone and computer — use it if a device goes missing.</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h"><h2>Your Data</h2></div>
        <div class="panel-b">
          <div style="font-size:14px;color:var(--ink-2);margin-bottom:12px">
            <b class="tnum">${DB.live().length}</b> entries · <b class="tnum">${hFmt(DB.live().reduce((a,e)=>a+Number(e.hours),0))}</b> hours · <b class="tnum">${MI.fmt(DB.live().reduce((a,e)=>a+MI.of(e),0))}</b> miles logged all-time
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="s-export">Download Backup</button>
            <button class="btn" id="s-import">Restore Backup</button>
            <input type="file" id="s-file" accept="application/json" hidden>
          </div>
        </div>
      </div>`;
  },

  wireSet(){
    document.getElementById("s-save").onclick = ()=>{
      DB.s.person = document.getElementById("s-name").value.trim();
      DB.s.weekStart = Number(document.getElementById("s-ws").value);
      DB.s.round = Number(document.getElementById("s-rd").value);
      DB.s.rate = Number(document.getElementById("s-rate").value || 0);
      DB.save(); this.paintWho(); this.toast("Saved"); this.render();
    };

    /* ---- account ---- */
    /* signing out wipes the local copy so a shared or sold device keeps nothing */
    const leave = async (scope) => {
      if(DB.linked()){
        try{ await Cloud.pushAll(); }
        catch(e){
          if(!confirm("Couldn't reach the server — anything logged offline may not be saved yet.\n\nSign out anyway?")) return;
        }
      }
      await Auth.signOut(scope);
      try{ localStorage.removeItem(KEY); localStorage.removeItem(AUTH); }catch(e){}
      DB.s = { entries: [], clients: {}, subs: [], person: "", url: "", key: "",
               weekStart: 1, round: 0, mode: "clock", rate: 0, lock: null };
      this.signInScreen(scope==="global" ? "Signed out everywhere." : "Signed out. This device no longer holds a copy.");
    };

    document.getElementById("a-out").onclick = ()=>{
      if(!confirm("Sign out on this device?\n\nThe local copy of your jobs is erased from this browser. Everything stays safe in the shared database.")) return;
      leave();
    };

    const allOut = document.getElementById("a-outall");
    if(allOut) allOut.onclick = ()=>{
      if(!confirm("Sign out of EVERY device signed in as " + Auth.email + "?\n\nUse this if a phone or laptop went missing. Everyone will have to sign in again.")) return;
      leave("global");
    };

    document.getElementById("a-pass").onclick = ()=>{
      this.modal("Change Password",
        `<div class="mb"><label class="f" for="np1">New password</label>
           <input class="inp" id="np1" type="password" autocomplete="new-password"></div>
         <div><label class="f" for="np2">Confirm</label>
           <input class="inp" id="np2" type="password" autocomplete="new-password"></div>
         <p class="hint">At least 8 characters.</p>`,
        `<button class="btn" onclick="UI.closeModal()">Cancel</button><button class="btn accent" id="npGo">Update Password</button>`);
      document.getElementById("npGo").onclick = async ()=>{
        const a = document.getElementById("np1").value, b = document.getElementById("np2").value;
        if(a.length < 8){ this.toast("Use at least 8 characters"); return; }
        if(a !== b){ this.toast("Passwords don't match"); return; }
        try{ await Auth.setPassword(a); this.closeModal(); this.toast("Password updated"); }
        catch(e){ this.toast(e.message); }
      };
    };

    document.getElementById("s-export").onclick = ()=>{
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([JSON.stringify(DB.s.entries,null,2)],{type:"application/json"}));
      a.download="tn-joblog-backup-"+D.today()+".json"; a.click(); this.toast("Backup downloaded");
    };
    const file = document.getElementById("s-file");
    document.getElementById("s-import").onclick = ()=> file.click();
    file.onchange = ()=>{
      const f=file.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload = ()=>{
        try{
          const rows=JSON.parse(r.result);
          const n=DB.merge(rows); Cloud.push(rows);
          this.toast(n+" entries restored"); this.render();
        }catch(e){ alert("That file isn't a valid backup."); }
      };
      r.readAsText(f);
    };
  },

  modal(title, body, foot){
    document.getElementById("mTitle").textContent = title;
    document.getElementById("mBody").innerHTML = body;
    document.getElementById("mFoot").innerHTML = foot || "";
    document.getElementById("mask").classList.add("show");
  },
  closeModal(){ document.getElementById("mask").classList.remove("show"); }
};

document.getElementById("mask").addEventListener("click", e => { if(e.target.id==="mask") UI.closeModal(); });


UI.boot();

/* ---------------------------------------------------------
   Self-updater: if a newer build is on the server, take it.
   Kills the "I don't see the new field" cache problem.
   --------------------------------------------------------- */
const BUILD = document.querySelector('meta[name="build"]').content;
async function checkBuild(){
  try{
    const r = await fetch("index.html?cb=" + Date.now(), { cache:"no-store" });
    if(!r.ok) return;
    const html = await r.text();
    const m = html.match(/name="build" content="([^"]+)"/);
    if(m && m[1] !== BUILD){
      /* never reload out from under someone who's mid-entry —
         wait until the form is empty or the work is saved */
      if(UI.hasDraft()){
        UI.updateWaiting = m[1];
        UI.showUpdateBar();
        return;
      }
      UI.toast("Updating to the latest version…");
      setTimeout(()=> location.replace(location.pathname + "?b=" + m[1]), 700);
    }
  }catch(e){}
}
checkBuild();
window.addEventListener("focus", checkBuild);
</script>
